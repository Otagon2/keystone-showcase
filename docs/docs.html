<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Keystone — Docs</title>
<style>
:root{
  --background:#000000; --card:#0b1220; --foreground:#f8fafc;
  --muted:#111a29; --muted-foreground:#8b96a5; --border:#1e293b; --input:#475569;
  --primary:#f8fafc; --ring:#94a3b8; --accent:#2dd4bf;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden;filter:grayscale(1)}
a{color:#5eead4}
/* shared top nav */
.topnav{position:sticky;top:0;z-index:50;flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px clamp(14px,4vw,28px);background:rgba(2,8,23,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topnav .brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--foreground);text-decoration:none;flex:none}
.topnav .brand .g{width:23px;height:23px;border-radius:7px;background:var(--primary);color:var(--background);display:grid;place-items:center;font-weight:800;font-family:var(--sans);font-size:12px}
.topnav .brand .sub{color:var(--muted-foreground);font-weight:400}
.topnav .navlinks{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.topnav a.nl{font-size:13px;font-weight:550;color:var(--muted-foreground);text-decoration:none;padding:7px 11px;border-radius:8px;transition:background .15s,color .15s;white-space:nowrap}
.topnav a.nl:hover{color:var(--foreground);background:var(--muted)}
.topnav a.nl.on{color:var(--foreground);background:var(--muted)}
.topnav a.nl.docs{color:#5eead4}
.topnav a.nl.docs:hover,.topnav a.nl.docs.on{color:#99f6e4;background:rgba(45,212,191,.14)}
.topnav a.nl.proto{color:#0a0a0a;background:#fafafa;font-weight:650;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 3px 14px -4px rgba(255,255,255,.35)}
.topnav a.nl.proto:hover{background:#e5e5e5}
@media(max-width:640px){.topnav{gap:8px;padding:9px 12px}.topnav .brand .sub{display:none}.topnav a.nl{padding:6px 8px;font-size:12px}}
/* docs shell + sidebar search/groups */
.shell{display:flex;flex:1;min-height:0;overflow:hidden}
.sidehead{padding:2px 6px 10px}
.docsearch{width:100%;background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--foreground);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .15s}
.docsearch::placeholder{color:var(--muted-foreground)}
.docsearch:focus{border-color:var(--accent)}
.grpitems.collapsed{display:none}
.chev{width:11px;height:11px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;opacity:.6}
.grouplabel.collapsed .chev{transform:rotate(-90deg)}
.gcount{font-family:var(--mono);font-weight:600;letter-spacing:0;color:var(--muted-foreground);background:var(--muted);border-radius:99px;padding:1px 7px;font-size:10px}
.sidenote{padding:14px 8px 4px;font-size:11.5px;color:var(--muted-foreground)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--input);border-radius:7px;border:3px solid var(--background);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
/* sidebar */
.side{width:310px;flex:none;border-right:1px solid var(--border);background:var(--card);overflow-y:auto;padding:16px 12px}
.home{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--muted-foreground);font-family:var(--mono);font-size:12.5px;padding:6px 8px;border-radius:6px}
.home:hover{background:var(--muted);color:var(--foreground)}
.home .g{width:22px;height:22px;border-radius:6px;background:var(--primary);color:var(--background);display:grid;place-items:center;font-weight:800;font-size:11px}
.grouplabel{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-foreground);padding:15px 8px 6px;transition:color .15s}
.grouplabel:hover{color:var(--foreground)}
.grouplabel .gname{flex:1;text-align:left}
.docitem{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:9px 10px;border-radius:8px;color:inherit;transition:background .15s}
.docitem:hover{background:var(--muted)}
.docitem.on{background:var(--muted);box-shadow:inset 2px 0 0 var(--accent)}
.docitem b{display:block;font-size:13px;font-weight:600}
.docitem span{display:block;font-size:11.5px;color:var(--muted-foreground);line-height:1.45;margin-top:2px}
.pdflink{display:flex;align-items:center;gap:8px;margin:14px 8px 4px;font-size:12.5px;color:#a78bfa;text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.pdflink:hover{background:var(--muted)}
/* reading pane */
.read{flex:1;overflow-y:auto;padding:40px 48px 90px}
.doc{max-width:820px;margin:0 auto}
.crumbbar{max-width:820px;margin:0 auto 8px;font-family:var(--mono);font-size:11.5px;color:var(--muted-foreground);display:flex;gap:8px;align-items:center;justify-content:space-between}
.crumbbar #crumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copymd{display:inline-flex;align-items:center;gap:6px;flex:none;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.copymd:hover{background:var(--muted);border-color:var(--input)}
.copymd svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.copymd.done{color:#4ade80;border-color:#14532d;background:#0d1f14}
.md{font-size:14.5px;line-height:1.68;color:#dbe2ea}
.md h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:6px 0 14px;color:var(--foreground)}
.md h2{font-size:19px;font-weight:650;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);color:var(--foreground)}
.md h3{font-size:15.5px;font-weight:650;margin:22px 0 8px;color:var(--foreground)}
.md h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:18px 0 6px}
.md p{margin:0 0 13px}
.md ul,.md ol{margin:0 0 14px;padding-left:22px}
.md li{margin-bottom:5px}
.md strong{color:var(--foreground);font-weight:650}
.md em{color:#c4cdd8}
.md hr{border:none;border-top:1px solid var(--border);margin:22px 0}
.md blockquote{border-left:3px solid var(--input);margin:0 0 13px;padding:2px 14px;color:var(--muted-foreground)}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:#e7c6ff}
.md pre{background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 14px}
.md pre code{background:none;border:none;padding:0;color:#cdd6e0;font-size:12.5px;line-height:1.55}
.md table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:12.8px;display:block;overflow-x:auto}
.md th{background:var(--muted);text-align:left;padding:8px 11px;border:1px solid var(--border);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;white-space:nowrap}
.md td{padding:8px 11px;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.md a{word-break:break-word}
.loading{color:var(--muted-foreground);font-family:var(--mono);font-size:13px}
@media (max-width:820px){body{flex-direction:column}.side{width:100%;flex:none;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}.read{padding:22px 18px 80px}.doc{max-width:none}.crumbbar{max-width:none}}
</style>

/* ---- tiny self-contained markdown renderer (headings, tables, lists, code, quote, hr, inline) ---- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(s){
 return esc(s)
  .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function isTableSep(x){return x&&x.includes('-')&&/^\s*\|?[\s:|-]+\|?\s*$/.test(x)}
function isBlockStart(x,nx){
 return /^#{1,6}\s/.test(x)||/^```/.test(x)||/^\s*[-*]\s/.test(x)||/^\s*\d+\.\s/.test(x)||/^\s*>/.test(x)||/^\s*([-*_])\1{2,}\s*$/.test(x)||(x.includes('|')&&isTableSep(nx));
}
function md2html(src){
 const L=src.replace(/\r\n/g,'\n').split('\n'); let h='',i=0;
 while(i<L.length){
  let l=L[i];
  if(/^```/.test(l)){i++;let b=[];while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++}i++;h+='<pre><code>'+esc(b.join('\n'))+'</code></pre>';continue}
  if(l.includes('|')&&isTableSep(L[i+1])){
   const rows=[l];i+=2;
   while(i<L.length&&L[i].includes('|')&&L[i].trim()!==''){rows.push(L[i]);i++}
   const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
   let t='<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>';
   for(let k=1;k<rows.length;k++)t+='<tr>'+cells(rows[k]).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>';
   h+=t+'</tbody></table>';continue;
  }
  let m=l.match(/^(#{1,6})\s+(.*)$/); if(m){h+='<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>';i++;continue}
  if(/^\s*([-*_])\1{2,}\s*$/.test(l)){h+='<hr>';i++;continue}
  if(/^\s*>/.test(l)){let b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++}h+='<blockquote>'+inl(b.join(' '))+'</blockquote>';continue}
  if(/^\s*[-*]\s+/.test(l)){let b=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){b.push(L[i].replace(/^\s*[-*]\s+/,''));i++}h+='<ul>'+b.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>';continue}
  if(/^\s*\d+\.\s+/.test(l)){let b=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){b.push(L[i].replace(/^\s*\d+\.\s+/,''));i++}h+='<ol>'+b.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>';continue}
  if(l.trim()===''){i++;continue}
  let b=[l];i++;
  while(i<L.length&&L[i].trim()!==''&&!isBlockStart(L[i],L[i+1])){b.push(L[i]);i++}
  h+='<p>'+inl(b.join(' '))+'</p>';
 }
 return h;
}

/* Normalise the source into clean, well-formatted Markdown (fence-aware) */
function cleanMd(src){
 const lines=src.replace(/\r\n?/g,'\n').split('\n');
 const out=[]; let inFence=false;
 for(let i=0;i<lines.length;i++){
  let ln=lines[i];
  const isFence=/^\s*(```|~~~)/.test(ln);
  if(isFence)inFence=!inFence;
  if(!inFence&&!isFence)ln=ln.replace(/[ \t]+$/,'');           // trim trailing whitespace outside code
  if(!inFence&&!isFence&&/^#{1,6}\s/.test(ln)&&out.length&&out[out.length-1].trim()!=='')out.push(''); // blank line before heading
  out.push(ln);
  if(!inFence&&!isFence&&/^#{1,6}\s/.test(ln)&&lines[i+1]!==undefined&&lines[i+1].trim()!=='')out.push(''); // blank line after heading
 }
 return out.join('\n').replace(/\n{3,}/g,'\n\n').replace(/\s+$/,'')+'\n';  // collapse extra blanks + one trailing newline
}

let currentMd='';
async function copyCurrentMd(){
