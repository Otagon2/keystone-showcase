<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Keystone — engagement log</title>
<style>
:root{
  --background:#000000; --card:#0b1220; --foreground:#f8fafc;
  --muted:#111a29; --muted-foreground:#8b96a5; --border:#1e293b; --input:#475569;
  --primary:#f8fafc; --ring:#94a3b8;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;min-height:100vh;padding:0 0 80px;filter:grayscale(1)}
a{color:#cbd5e1}
.wrap{max-width:760px;margin:0 auto;padding:34px 24px 0}
/* shared top nav */
.topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px clamp(14px,4vw,28px);background:rgba(2,8,23,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topnav .brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--foreground);text-decoration:none;flex:none}
.topnav .brand .g{width:23px;height:23px;border-radius:7px;background:var(--primary);color:var(--background);display:grid;place-items:center;font-weight:800;font-family:var(--sans);font-size:12px}
.topnav .brand .sub{color:var(--muted-foreground);font-weight:400}
.topnav .navlinks{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.topnav a.nl{font-size:13px;font-weight:550;color:var(--muted-foreground);text-decoration:none;padding:7px 11px;border-radius:8px;transition:background .15s,color .15s;white-space:nowrap}
.topnav a.nl:hover{color:var(--foreground);background:var(--muted)}
.topnav a.nl.on{color:var(--foreground);background:var(--muted)}
.topnav a.nl.docs{color:#5eead4}
.topnav a.nl.docs:hover,.topnav a.nl.docs.on{color:#99f6e4;background:rgba(45,212,191,.12)}
.topnav a.nl.proto{color:#0a0a0a;background:#fafafa;font-weight:650;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 3px 14px -4px rgba(255,255,255,.35)}
.topnav a.nl.proto:hover{background:#e5e5e5}
@media(max-width:640px){.topnav{gap:8px;padding:9px 12px}.topnav .brand .sub{display:none}.topnav a.nl{padding:6px 8px;font-size:12px}}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:20px 0 8px}
.lede{font-size:14.5px;color:var(--muted-foreground);max-width:600px;line-height:1.6}
.lede .mut{color:var(--muted-foreground)}
/* day log list */
.log{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.logitem{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;transition:border-color .16s,transform .08s,box-shadow .16s}
.logitem:hover{border-color:var(--input);transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
.logtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logn{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.logdate{font-family:var(--mono);font-size:11.5px;color:var(--muted-foreground)}
.logitem h2{font-size:17px;font-weight:650;margin:9px 0 6px;letter-spacing:-.01em;color:var(--foreground)}
.logitem p{font-size:13.5px;color:var(--muted-foreground);line-height:1.6}
.logopen{margin-top:14px;font-size:12.5px;font-weight:600;color:var(--foreground);display:inline-flex;align-items:center;gap:4px}
footer{margin-top:40px;font-family:var(--mono);font-size:11.5px;color:var(--muted-foreground);border-top:1px solid var(--border);padding-top:18px;line-height:1.8}
</style>
</head>
<body>
<header class="topnav">
  <a class="brand" href="index.html"><span class="g">K</span>keystone <span class="sub">/ showcase</span></a>
  <div class="navlinks">
    <a class="nl" data-page="index.html" href="index.html">Home</a>
    <a class="nl" data-page="day-1.html" href="day-1.html">Jul 3</a>
    <a class="nl" data-page="day-2.html" href="day-2.html">Jul 4</a>
    <a class="nl" data-page="day-3.html" href="day-3.html">Jul 9</a>
    <a class="nl" data-page="day-4.html" href="day-4.html">Jul 10</a>
    <a class="nl docs" data-page="docs.html" href="docs.html">Docs</a>
    <a class="nl proto" href="keystone/" target="_blank" rel="noopener">Prototype ↗</a>
  </div>
</header>
<div class="wrap">
  <h1>Keystone — engagement log</h1>
  <p class="lede">A day-by-day log of the design work. Open a day to see everything that shipped that day. <span class="mut">Internal client work · mock data, no backend.</span></p>
  <div class="log" id="log"></div>
  <footer>shadcn/ui New York · dark + light · mock, no backend</footer>
</div>
<script>
'use strict';
/* Engagement day log — one entry per day, newest first. daily-ship-update appends a day here. */
const DAYS=[
 { n:1, date:'2026-07-03', page:'day-1.html',
   title:'Base links ready — prototypes, docs & showcase are live',
   summary:'The clickable base for design review: four surface prototypes (Prompt Management, Organization Admin, Inbox, System Admin), the documentation viewer, and the source-PRD tracker — all on the live site.' },
 { n:2, date:'2026-07-04', page:'day-2.html',
   title:'The evaluation loop — designed and made clickable',
   summary:'The loop (Dataset → Prompt → Evaluator → Experiment → Trace) taken from research + wireframes to a real, clickable shadcn “New York” prototype you can walk end-to-end — grounded in the actual esberi/keystone repo + PRD #1, then independently audited and hardened.' },
 { n:3, date:'2026-07-09', page:'day-3.html',
   title:'Navigation rebuilt + Datasets & Prompt Management built out, hardened for scale & first-run',
   summary:'Zaki\'s review answered point-by-point (breadcrumbs gone, titles & CTAs in the top bar, collapsible sidebar, Light/Dark/System theme) and both PRDs built out — then, for Sunday, hardened for the full journey: Datasets now hold a real 10,000 rows with an instant grid (search · filter · paging · select-all-across-pages · sample), a first-run path that creates a dataset in ~0.4s, calm handling of messy imports, and a scaled prompt library. Plus a competitor-parity build (playground inline scorers, Ask copilot, Monitor, Review, trend chart) and a shippable demo script + Keystone-vs-Braintrust/Arize/Phoenix comparison.' },
 { n:4, date:'2026-07-10', page:'day-4.html',
   title:'Measured against Arize & Braintrust live — then the prototype upgraded from the findings',
   summary:'Logged into both competitors and walked 30+ screens side-by-side with Keystone — same tasks, same test CSV — scored on ten usability criteria (Arize 31 · Braintrust 35 · Keystone 47 of 50). Every finding worth adopting was built in the same day: CSV import that lands you inside the new dataset, a Graph view on traces with token cost per node, one-click Evaluate-in from datasets, an attention triage panel, saved trace views, plain-words experiment verdicts, and composable Monitor tiles. Both teardown docs are on the site.' },
];
(function(){
 const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 const dow=d=>DOW[new Date(d+'T00:00:00').getDay()];
 const fmt=d=>{const p=d.split('-');return MO[+p[1]-1]+' '+(+p[2])+', '+p[0];};
 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const arrow='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:2px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
 document.getElementById('log').innerHTML=[...DAYS].reverse().map(function(d){return '<a class="logitem" href="'+d.page+'"><div class="logtop"><span class="logn">Day '+d.n+'</span><span class="logdate">'+dow(d.date)+', '+fmt(d.date)+'</span></div><h2>'+esc(d.title)+'</h2><p>'+esc(d.summary)+'</p><div class="logopen">Open Day '+d.n+' '+arrow+'</div></a>';}).join('');
})();
</script>
<script>(function(){var p=(location.pathname.split('/').pop()||'index.html');if(p==='day-2-walkthrough.html')p='day-2.html';document.querySelectorAll('.topnav a.nl[data-page]').forEach(function(a){if(a.getAttribute('data-page')===p)a.classList.add('on');});})();</script>
</body>
</html>
