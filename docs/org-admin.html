<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone — Organization Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1220'/><text x='16' y='23' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='20' fill='%23f8fafc'>K</text></svg>">
<style>
/* ============ shadcn New York token system (shared with all Keystone prototypes; v2 fidelity) ============ */
:root{
  --background:#ffffff; --foreground:#020817; --card:#ffffff;
  --primary:#0f172a; --primary-foreground:#f8fafc;
  --secondary:#f1f5f9; --secondary-foreground:#0f172a;
  --muted:#f1f5f9; --muted-foreground:#5b6472;
  --accent:#f1f5f9; --accent-foreground:#0f172a;
  --destructive:#dc2626; --destructive-foreground:#f8fafc;
  --border:#e2e8f0; --input:#7e889c; --ring:#0f172a;
  --success:#15803d; --warning:#b45309; --running:#2563eb;
  --radius:8px;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.44,1); --dur:.17s;
  --elev-1:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.04);
  --shadow-md:0 2px 6px rgba(15,23,42,.08),0 10px 24px -8px rgba(15,23,42,.18);
  --shadow-lg:0 8px 18px rgba(15,23,42,.12),0 28px 56px -16px rgba(15,23,42,.32);
}
.dark{
  --background:#020817; --foreground:#f8fafc; --card:#0b1220;
  --primary:#f8fafc; --primary-foreground:#0f172a;
  --secondary:#16202f; --secondary-foreground:#f8fafc;
  --muted:#111a29; --muted-foreground:#8b96a5;
  --accent:#1a2436; --accent-foreground:#f8fafc;
  --destructive:#f87171; --destructive-foreground:#0f172a;
  --border:#1e293b; --input:#475569; --ring:#94a3b8;
  --success:#4ade80; --warning:#fbbf24; --running:#60a5fa;
  --elev-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 2px 8px rgba(0,0,0,.46),0 14px 30px -8px rgba(0,0,0,.62);
  --shadow-lg:0 10px 22px rgba(0,0,0,.55),0 36px 68px -18px rgba(0,0,0,.74);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.5;background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
input,select{font:inherit;color:inherit}
::placeholder{color:var(--muted-foreground);opacity:.7}
::selection{background:color-mix(in srgb,var(--ring) 32%,transparent)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--input);border-radius:7px;border:3px solid var(--background);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground)}
::-webkit-scrollbar-track{background:transparent}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font-family:var(--mono);font-size:11px;background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted-foreground)}
.ctxnote{font-size:12px;color:var(--muted-foreground)}

/* ============ shell ============ */
#app{display:flex;height:100vh;overflow:hidden}
/* shadcn: Sidebar */
.sidebar{width:246px;flex:none;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border)}
.sb-brand{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.brandrow{display:flex;align-items:center;gap:9px;padding:2px 4px 10px}
.klogo{width:26px;height:26px;flex:none;border-radius:7px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:13px;font-weight:800}
.brandrow b{font-size:13.5px;letter-spacing:.01em}
/* shadcn: Sidebar project switcher (DropdownMenu trigger) */
.projsw{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--background);transition:background var(--dur),border-color var(--dur)}
.projsw:hover{background:var(--accent)}
.projsw .pj{width:22px;height:22px;flex:none;border-radius:5px;background:var(--secondary);border:1px solid var(--border);display:grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--mono)}
.projsw .nm{flex:1;text-align:left;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projsw .sub{display:block;font-size:10px;color:var(--muted-foreground);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.projsw svg{color:var(--muted-foreground)}
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.sb-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-foreground);padding:10px 8px 5px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;color:var(--muted-foreground);font-size:13px;font-weight:500;transition:background var(--dur),color var(--dur)}
.nav-item:hover{background:var(--accent);color:var(--foreground)}
.nav-item.on{background:var(--secondary);color:var(--foreground);font-weight:600}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted-foreground);font-family:var(--mono);background:var(--muted);border:1px solid var(--border);border-radius:999px;padding:0 6px;line-height:16px}
.nav-item.org-entry svg{color:var(--running)}
.sb-user{padding:8px}
.sb-sep{height:1px;background:var(--border);margin:6px 8px}
.sb-foot{border-top:1px solid var(--border);padding:9px}
.acct{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:7px;transition:background var(--dur)}
.acct:hover{background:var(--accent)}
.avatar{width:28px;height:28px;flex:none;border-radius:999px;background:var(--secondary);border:1px solid var(--border);display:grid;place-items:center;font-size:10.5px;font-weight:700}
.acct-info{flex:1;text-align:left;min-width:0}
.acct-info b{display:block;font-size:12.5px;line-height:1.2}
.acct-info span{font-size:10.5px;color:var(--muted-foreground)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{flex:none;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--card)}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.crumb a{color:var(--muted-foreground);cursor:pointer;white-space:nowrap}
.crumb a:hover{color:var(--foreground)}
.crumb .sep{color:var(--muted-foreground);opacity:.5}
.crumb .cur{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .org{color:var(--running);font-weight:600}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.hsearch{width:190px;height:30px;max-width:38vw}
.content{flex:1;overflow:auto}
.wrap{padding:22px 24px;max-width:1120px}
.wrap.wide{max-width:1220px}
.wrap>p.ctxnote{max-width:82ch}

/* ============ buttons (shadcn: Button) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap;transition:background var(--dur),color var(--dur),border-color var(--dur),box-shadow var(--dur),transform .07s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 2px rgba(2,8,23,.22)}
.btn.primary:hover{opacity:.9}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.outline{border-color:var(--input);background:transparent}
.btn.outline:hover{background:var(--accent)}
.btn.ghost:hover{background:var(--accent)}
.btn.destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn.destructive:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;color:var(--muted-foreground);transition:background var(--dur),color var(--dur)}
.iconbtn:hover{background:var(--accent);color:var(--foreground)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}

/* ============ badges (shadcn: Badge — New York rounded-md, not pills) ============ */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid;background:transparent;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.role{color:var(--running);border-color:color-mix(in srgb,var(--running) 45%,transparent)}
.badge.active{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.badge.invited{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.badge.archived{color:var(--muted-foreground);border-color:var(--border)}
.badge.neutral{color:var(--muted-foreground);border-color:var(--border)}
.badge.scope-org{color:var(--running);border-color:color-mix(in srgb,var(--running) 45%,transparent)}
.badge.scope-project{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.badge.scope-primitive{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.badge.scope-user{color:var(--muted-foreground);border-color:var(--border)}
.badge.src-ui{color:var(--muted-foreground);border-color:var(--border)}
.badge.src-api{color:var(--running);border-color:color-mix(in srgb,var(--running) 45%,transparent)}
.pill{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;font-size:11px;font-family:var(--mono);background:var(--muted);color:var(--muted-foreground);border:1px solid var(--border)}
/* org label key:value token */
.lbl{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);white-space:nowrap}
.lbl b{color:var(--muted-foreground);font-weight:600}

/* ============ cards / tables ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--elev-1)}
.card h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:12px;font-weight:600}
.krow{display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.krow:last-child{border-bottom:none}
.krow b{width:160px;flex:none;color:var(--muted-foreground);font-weight:500;font-size:12px}
.sectionhead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.sectionhead h3{font-size:15px;font-weight:600}
.notecard{border:1px dashed var(--input);border-radius:var(--radius);padding:11px 13px;font-size:12.5px;color:var(--muted-foreground);display:flex;gap:9px;margin-bottom:14px;align-items:flex-start}
.notecard svg{flex:none;margin-top:1px}
.table{width:100%;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--elev-1);margin-bottom:12px}
.thead{display:flex;align-items:center;background:var(--muted);border-bottom:1px solid var(--border)}
.th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);padding:9px 12px;font-weight:700}
.th.r{justify-content:flex-end;text-align:right}
.trow{display:flex;align-items:center;border-bottom:1px solid var(--border);font-size:13px;transition:background var(--dur),box-shadow var(--dur)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--accent)}
.trow.clickable{cursor:pointer}
.trow.clickable:hover{box-shadow:inset 2px 0 0 var(--muted-foreground)}
.td{padding:10px 12px;min-width:0;display:flex;align-items:center;gap:8px}
.td.r{justify-content:flex-end;text-align:right}
.td.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.member-id{display:flex;align-items:center;gap:10px;min-width:0}
.member-id b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rolesel{height:28px;border:1px solid var(--input);border-radius:6px;background:var(--background);font-size:12.5px;padding:0 6px;color:var(--foreground);max-width:100%}
.rolesel:disabled{opacity:.6;cursor:not-allowed;background:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:11px;padding:54px 20px;color:var(--muted-foreground);text-align:center}
.empty svg.ic{width:30px;height:30px;opacity:.5}
.empty b{color:var(--foreground);font-size:13.5px}

/* shadcn: Switch */
.switch{position:relative;display:inline-flex;align-items:center;width:34px;height:19px;border-radius:999px;background:var(--input);transition:background var(--dur);flex:none;padding:0;border:1px solid transparent}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;left:2px;top:1px;width:15px;height:15px;border-radius:999px;background:var(--background);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform var(--dur)}
.switch.on::after{transform:translateX(15px)}
.switch:disabled{opacity:.55;cursor:not-allowed}

/* ============ filter bar (Audit) ============ */
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.selm{height:32px;border:1px solid var(--input);border-radius:6px;background:var(--background);font-size:12.5px;padding:0 8px;color:var(--foreground)}
.fbar .inp{height:32px}

/* ============ menus / dialogs / cmdk / toasts ============ */
.menu{position:fixed;z-index:300;min-width:210px;max-width:280px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:5px;font-size:13px;animation:ovmenu .14s var(--ease);transform-origin:top}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;text-align:left;transition:background var(--dur)}
.menu .mi:hover{background:var(--accent)}
.menu .mi.danger{color:var(--destructive)}
.menu .mi:disabled{opacity:.42;cursor:not-allowed}
.menu .mi .rt{margin-left:auto;font-size:10.5px;color:var(--muted-foreground)}
.menu .msep{height:1px;background:var(--border);margin:5px 4px}
.menu .mnote{font-size:10.5px;color:var(--muted-foreground);padding:2px 9px 6px 32px;line-height:1.4}
.menu .mhead{font-size:10.5px;color:var(--muted-foreground);padding:6px 9px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.scrim{position:fixed;inset:0;z-index:400;background:rgba(2,8,23,.62);display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;animation:fade .16s ease-out}
.dialog{width:480px;max-width:92vw;max-height:84vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:22px;animation:ovdlg .2s var(--ease)}
.dialog.lg{width:560px}
.dialog h3{font-size:16px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.dialog .sub{font-size:13px;color:var(--muted-foreground);margin-bottom:16px;line-height:1.5}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px;color:var(--foreground)}
.inp{width:100%;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--input);background:var(--background);font-size:13px;color:var(--foreground)}
.inp:focus{outline:2px solid var(--ring);outline-offset:-1px}
.inp[readonly],.inp:disabled{background:var(--muted);color:var(--muted-foreground);cursor:not-allowed}
select.inp{appearance:auto}
.fieldhint{font-size:11.5px;margin-top:5px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.fieldhint.ok{color:var(--success)}
.fieldhint.bad{color:var(--warning)}
.swrow{display:flex;align-items:center;gap:12px;margin-bottom:13px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--muted)}
.swrow .swtxt{font-size:13px;font-weight:500}
.swrow .swtxt span{display:block;font-size:11.5px;color:var(--muted-foreground);font-weight:400}
.swrow .switch{margin-left:auto}
.warnbox{border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);background:color-mix(in srgb,var(--warning) 8%,transparent);color:var(--warning);border-radius:8px;padding:9px 11px;font-size:12px;display:flex;gap:8px;margin-bottom:13px;align-items:flex-start}
.warnbox svg{flex:none;margin-top:1px}
.reassign{border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:13px;background:var(--muted)}
.reassign .rr{display:flex;align-items:center;gap:9px;padding:6px 0}
.reassign .rr .pn{flex:1;font-size:12.5px;font-weight:600;min-width:0}
.reassign .rr select{width:190px;max-width:52%}
/* audit before/after diff */
.diff{display:flex;align-items:stretch;gap:9px;margin:2px 0 6px}
.diffcol{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--muted);min-width:0}
.diffcol .dl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);margin-bottom:5px;font-weight:700}
.diffcol.before{border-color:color-mix(in srgb,var(--destructive) 40%,transparent)}
.diffcol.after{border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.diffarrow{display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.kv{font-family:var(--mono);font-size:11.5px;line-height:1.7;word-break:break-word}
.kv .k{color:var(--muted-foreground)}
.cmdk{width:560px;max-width:92vw;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;animation:ovdlg .18s var(--ease)}
.cmdk .cin{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.cmdk input{flex:1;background:none;border:none;outline:none;font-size:14px}
.cmdk .list{max-height:44vh;overflow-y:auto;padding:7px}
.cmdk .glabel{font-size:11px;color:var(--muted-foreground);padding:7px 10px 3px;font-weight:600}
.cmdk .crow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.cmdk .crow:hover,.cmdk .crow.sel{background:var(--accent)}
.cmdk .cfoot{display:flex;gap:14px;padding:9px 15px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-foreground)}
#toasts{position:fixed;bottom:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:11px 14px;font-size:13px;animation:tin .18s ease-out;max-width:420px}
.toast svg{flex:none}
.toast-act{margin-left:4px;font-weight:600;color:var(--running);padding:2px 9px;border-radius:5px}
.toast-act:hover{background:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ovdlg{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ovmenu{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rowflash{0%{background:color-mix(in srgb,var(--success) 20%,transparent)}100%{background:transparent}}
.trow.flash{animation:rowflash 1.3s ease-out}
.sk{background:linear-gradient(90deg,var(--muted) 25%,var(--accent) 40%,var(--muted) 60%);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:6px;height:12px;display:inline-block}
.sk-row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-bottom:1px solid var(--border)}
.stage-blank{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;text-align:center;color:var(--muted-foreground)}
.stage-blank .sicon{width:46px;height:46px;border-radius:12px;background:var(--muted);border:1px solid var(--border);display:grid;place-items:center}
.stage-blank .sicon svg{width:22px;height:22px}
.stage-blank b{color:var(--foreground);font-size:15px}
.stage-blank p{max-width:440px;font-size:13px;line-height:1.55}
/* ============ responsive ============ */
.hamburger{display:none}
.sb-scrim{display:none}
@media(max-width:900px){
 .hamburger{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;color:var(--muted-foreground);flex:none;border:none;background:none}

 else rows=list.map(m=>{

  return '<div class="trow">'+
   '<div class="td" style="'+W.id+'"><div class="member-id"><span class="avatar">'+esc(initials(m.n))+'</span><b>'+esc(m.n)+'</b></div></div>'+
   '<div class="td ctxnote mono" style="'+W.em+'"><span class="trunc">'+esc(m.e)+'</span></div>'+
   '<div class="td" style="'+W.role+'">'+roleCell+'</div>'+

   '<div class="td ctxnote" style="'+W.la+'">'+esc(m.last)+'</div>'+

   '<div class="td" style="'+W.x+'"><button class="iconbtn" onclick="memMenu(event,\''+m.id+'\')">'+icon('more')+'</button></div></div>';
 }).join('');
 const summary=activeMembers().length+' active · '+MEMBERS.filter(m=>m.status==='invited').length+' invited · '+adminCount()+' org admin'+(adminCount()===1?'':'s');
 return '<div class="wrap wide"><div class="sectionhead"><h3>Members</h3><span class="ctxnote">'+summary+'</span></div>'+
  '<div class="table" style="min-width:1052px">'+head+rows+'</div>'+

}
function setRole(id,el){const m=mById(id);const nv=el.value;
 if(m.role==='org_admin'&&nv==='member'&&adminCount()<=1){el.value='org_admin';toast(ORG.name+' must always have at least one org admin — promote another member first.','alertT');return}
 const before={org_role:m.role};m.role=nv;
 appendAudit('member.role_changed',m.e,'org','ui',before,{org_role:nv},nv==='org_admin'?'Promoted member to org_admin.':'Demoted org_admin to member.');
 toast(m.n+' is now '+nv+' · audited','shieldCheck');render();
}

/* Add member — email must match the org domain; Send stays disabled until it does */
function addMemberDlg(){
 openDialog('<h3>Add member</h3><p class="sub">Send an invite. Membership is <b>domain-bound</b>: only <b class="mono">@'+esc(ORG.domain)+'</b> addresses can join — the domain is set by your Keystone administrator.</p>'+
  '<div class="field"><label>Email</label><input class="inp mono" id="am-email" placeholder="name@'+esc(ORG.domain)+'" autocomplete="off" oninput="onEmailInput()"><div class="fieldhint" id="am-hint">Must be an <b class="mono">@'+esc(ORG.domain)+'</b> address.</div></div>'+
  '<div class="field"><label>Org role</label><select class="inp" id="am-role"><option value="member" selected>member</option><option value="org_admin">org_admin</option></select></div>'+
  '<div class="swrow"><div class="swtxt">Can create projects<span>Let this member start new projects.</span></div><button class="switch" id="am-cp" aria-label="Toggle create projects" onclick="this.classList.toggle(\'on\')"></button></div>'+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" id="am-go" disabled onclick="doAddMember()">'+icon('mail')+'Send invite</button></div>');
}
function onEmailInput(){const v=document.getElementById('am-email').value.trim();const hint=document.getElementById('am-hint');const go=document.getElementById('am-go');
 const ok=new RegExp('^[^@\\s]+@'+ORG.domain.replace(/[.]/g,'\\.')+'$','i').test(v);
 if(!v){hint.className='fieldhint';hint.innerHTML='Must be an <b class="mono">@'+esc(ORG.domain)+'</b> address.';go.disabled=true;return}
 if(ok){hint.className='fieldhint ok';hint.innerHTML='Looks good — <b class="mono">@'+esc(ORG.domain)+'</b> address.';go.disabled=false;}
 else{hint.className='fieldhint bad';hint.innerHTML='Rejected — members must be at <b class="mono">@'+esc(ORG.domain)+'</b>. Other domains (personal / partner) are not supported.';go.disabled=true;}
}
function doAddMember(){const v=document.getElementById('am-email').value.trim();const role=document.getElementById('am-role').value;const cp=document.getElementById('am-cp').classList.contains('on');
 const local=v.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
 const m={id:'m'+Date.now(),n:local,e:v,role:role,canCreate:role==='org_admin'?true:cp,status:'invited',joined:'—',last:'—',projects:[]};
 MEMBERS.push(m);appendAudit('member.added',v,'org','ui',null,{org_role:role,can_create_projects:m.canCreate},'Invited at @'+ORG.domain+'.');
 closeDlg();render();toast('Invite sent to '+v+' ('+role+')','mail');
}

/* Remove from org — reassign any owned projects, then type-name-to-confirm */
function removeDlg(id){const m=mById(id);
 if(isLastAdmin(m)){toast('Blocked — the org must keep at least one org admin.','alertT');return}
 const owned=ownedBy(m.n);
 const others=activeMembers().filter(x=>x.id!==id);
 let reassign='';
 if(owned.length){
  reassign='<div class="field"><label>Reassign owned projects ('+owned.length+') — required</label><div class="reassign" id="rm-reassign">'+
   owned.map(p=>'<div class="rr">'+icon('folder')+'<span class="pn">'+esc(p.name)+'</span>'+icon('arrowRight','width:14px;height:14px;color:var(--muted-foreground)')+
    '<select data-pid="'+p.id+'" onchange="rmCheck(\''+id+'\')"><option value="">Select new owner…</option>'+others.map(o=>'<option value="'+o.id+'">'+esc(o.n)+'</option>').join('')+'</select></div>').join('')+
   '</div></div>';
 }
 openDialog('<h3 style="color:var(--destructive)">Remove '+esc(m.n)+' from '+esc(ORG.name)+'</h3><p class="sub">Ends their access to the whole org. This is recorded to Audit and <b>cannot be undone</b>.</p>'+
  (owned.length?'<div class="warnbox">'+icon('alertT')+'<b>'+esc(m.n)+'</b> owns '+owned.length+' project'+(owned.length>1?'s':'')+'. Removal never orphans work — reassign each below before you can continue.</div>':'')+
  reassign+
  '<div class="field"><label>Type <b class="mono">'+esc(m.n)+'</b> to confirm</label><input class="inp" id="rm-name" autocomplete="off" placeholder="'+esc(m.n)+'" oninput="rmCheck(\''+id+'\')"></div>'+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn destructive" id="rm-go" disabled onclick="doRemove(\''+id+'\')">'+icon('trash')+'Remove &amp; end access</button></div>');
}
function rmCheck(id){const m=mById(id);const sels=[...document.querySelectorAll('#rm-reassign select')];
 const allSet=sels.every(s=>s.value);const nameOk=document.getElementById('rm-name').value.trim()===m.n;
 document.getElementById('rm-go').disabled=!(allSet&&nameOk);
}
function doRemove(id){const m=mById(id);const sels=[...document.querySelectorAll('#rm-reassign select')];
 sels.forEach(s=>{const p=pById(s.getAttribute('data-pid'));const no=mById(s.value);if(p&&no){const before={owner:p.owner};p.owner=no.n;if(!no.projects.includes(p.name))no.projects.push(p.name);appendAudit('project.transferred',p.name,'project','ui',before,{owner:no.n},'Ownership reassigned during offboarding of '+m.n+'.');}});
 MEMBERS=MEMBERS.filter(x=>x.id!==id);
 appendAudit('member.removed',m.e,'org','ui',{status:'active'},{status:'removed'},'Offboarded from '+ORG.name+(sels.length?'; '+sels.length+' project(s) reassigned first.':'.'));
 closeDlg();render();toast('Removed '+m.n+' — access ended · audited','trash');
}

 else if(!list.length)rows='<div class="empty">'+icon('search')+'<b>No labels match this search</b></div>';
 else rows=list.map(l=>'<div class="trow">'+
  '<div class="td" style="'+W.l+'"><span class="lbl"><b>'+esc(l.key)+'</b>:'+esc(l.value)+'</span></div>'+
  '<div class="td ctxnote" style="'+W.d+'"><span class="trunc">'+esc(l.desc||'—')+'</span></div>'+
  '<div class="td r mono" style="'+W.u+'" title="'+l.usage+' entities across the org use this label">'+l.usage+'</div>'+
  '<div class="td" style="'+W.x+'"><button class="iconbtn" onclick="labelMenu(event,\''+l.id+'\')">'+icon('more')+'</button></div></div>').join('');
 return '<div class="wrap"><div class="sectionhead"><h3>Labels</h3><span class="ctxnote">org taxonomy · '+LABELS.length+' labels</span></div>'+
  '<div class="notecard">'+icon('info')+'<span>Org labels are available <b>read-only</b> to every project. Projects add their own labels in each project\'s <b>Manage → Tags</b>. Scopes resolve <b class="mono">system &gt; org &gt; project</b>.</span></div>'+
  '<div class="table" style="min-width:640px">'+head+rows+'</div></div>';
}
function labelMenu(e,id){
 openMenu(e,'<button class="mi" onclick="closeMenus();editLabelDlg(\''+id+'\')">'+icon('edit')+'Edit</button>'+
  '<button class="mi" onclick="closeMenus();renameDlg(\''+id+'\')">'+icon('tag')+'Rename</button>'+
  '<button class="mi" '+(LABELS.length<2?'disabled':'')+' onclick="closeMenus();mergeDlg(\''+id+'\')">'+icon('merge')+'Merge into…</button>'+
  '<div class="msep"></div>'+
  '<button class="mi danger" onclick="closeMenus();deleteLabelDlg(\''+id+'\')">'+icon('trash')+'Delete</button>');
}
function newLabelDlg(){labelForm(null);}
function editLabelDlg(id){labelForm(id,false);}
function labelForm(id,renameOnly){const l=id?lById(id):null;const isEdit=!!l;
 openDialog('<h3>'+(isEdit?'Edit label':'New label')+'</h3><p class="sub">Define a shared <span class="mono">key:value</span> classification for all of '+esc(ORG.name)+'.</p>'+
  '<div class="field"><label>Key</label><input class="inp mono" id="lb-key" placeholder="compliance" value="'+esc(l?l.key:'')+'"></div>'+
  '<div class="field"><label>Value</label><input class="inp mono" id="lb-val" placeholder="pii" value="'+esc(l?l.value:'')+'"></div>'+
  '<div class="field"><label>Description <span class="ctxnote">(optional)</span></label><input class="inp" id="lb-desc" placeholder="What this label means" value="'+esc(l?l.desc:'')+'"></div>'+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="doSaveLabel('+(id?'\''+id+'\'':'null')+')">'+(isEdit?'Save changes':'Create label')+'</button></div>');
}
function doSaveLabel(id){const key=(document.getElementById('lb-key').value.trim()||'key');const val=(document.getElementById('lb-val').value.trim()||'value');const desc=document.getElementById('lb-desc').value.trim();
 if(id){const l=lById(id);const before={key:l.key,value:l.value};l.key=key;l.value=val;l.desc=desc;appendAudit('label.updated',labelText(l),'org','ui',before,{key:key,value:val},'Org label edited.');toast('Label updated · audited','check');}
 else{const l={id:'l'+Date.now(),key:key,value:val,desc:desc,usage:0};LABELS.push(l);appendAudit('label.created',labelText(l),'org','ui',null,{key:key,value:val},'New org label defined.');toast('Created label '+labelText(l)+' · audited','tag');}
 closeDlg();render();
}
function renameDlg(id){const l=lById(id);
 openDialog('<h3>Rename label</h3><p class="sub">Renaming updates the <span class="mono">key:value</span> everywhere the label is used ('+l.usage+' entities).</p>'+
  '<div class="field"><label>Key</label><input class="inp mono" id="rn-key" value="'+esc(l.key)+'"></div>'+
  '<div class="field"><label>Value</label><input class="inp mono" id="rn-val" value="'+esc(l.value)+'"></div>'+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="doRename(\''+id+'\')">Rename</button></div>');
}
function doRename(id){const l=lById(id);const before={key:l.key,value:l.value};l.key=document.getElementById('rn-key').value.trim()||l.key;l.value=document.getElementById('rn-val').value.trim()||l.value;
 appendAudit('label.renamed',labelText(l),'org','ui',before,{key:l.key,value:l.value},'Org label renamed.');closeDlg();render();toast('Renamed to '+labelText(l)+' · audited','tag');
}
function mergeDlg(id){const l=lById(id);const targets=LABELS.filter(x=>x.id!==id);
 openDialog('<h3>Merge label</h3><p class="sub">Fold <span class="lbl"><b>'+esc(l.key)+'</b>:'+esc(l.value)+'</span> into another label — its usages move to the target and this label is removed. The tool for ending taxonomy sprawl (e.g. <span class="mono">sensitive</span> / <span class="mono">PII</span> into one canonical label).</p>'+
  '<div class="field"><label>Merge into</label><select class="inp" id="mg-target">'+targets.map(t=>'<option value="'+t.id+'">'+esc(labelText(t))+' · '+t.usage+' uses</option>').join('')+'</select></div>'+
  '<div class="warnbox">'+icon('alertT')+'<span id="mg-note"><b>'+l.usage+'</b> entities will move to the target label. This cannot be undone.</span></div>'+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="doMerge(\''+id+'\')">'+icon('merge')+'Merge</button></div>');
}
function doMerge(id){const l=lById(id);const t=lById(document.getElementById('mg-target').value);if(!t){return}
 const moved=l.usage;t.usage+=l.usage;LABELS=LABELS.filter(x=>x.id!==id);
 appendAudit('label.merged',labelText(l),'org','ui',{label:labelText(l),usage:moved},{merged_into:labelText(t)},moved+' entities moved to '+labelText(t)+'.');
 closeDlg();render();toast('Merged '+labelText(l)+' into '+labelText(t)+' ('+moved+' moved) · audited','merge');
}
function deleteLabelDlg(id){const l=lById(id);
 openDialog('<h3 style="color:var(--destructive)">Delete label</h3><p class="sub">Removes <span class="lbl"><b>'+esc(l.key)+'</b>:'+esc(l.value)+'</span> from the org taxonomy.</p>'+
  (l.usage>0?'<div class="warnbox">'+icon('alertT')+'<b>'+l.usage+' entities</b> currently use this label. Deleting removes the classification from them. Consider <b>Merge into…</b> instead to preserve the usages.</div>':'<p class="ctxnote" style="margin-bottom:8px">This label is not in use.</p>')+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn destructive" onclick="doDeleteLabel(\''+id+'\')">Delete label</button></div>');
}
function doDeleteLabel(id){const l=lById(id);LABELS=LABELS.filter(x=>x.id!==id);appendAudit('label.deleted',labelText(l),'org','ui',{usage:l.usage},null,'Org label deleted.');closeDlg();render();toast('Deleted '+labelText(l)+' · audited','trash');}

/* ============ Settings (App. F) — sectioned org config form ============ */
function settingsScreen(r){
 return '<div class="wrap"><div class="sectionhead"><h3>Settings</h3><span class="ctxnote">organization configuration</span></div>'+
  '<div class="card"><h4>Organization</h4>'+
   '<div class="field"><label>Organization name</label><input class="inp" id="st-name" value="'+esc(ORG.name)+'"></div>'+
   '<div class="field"><label>Email domain</label><input class="inp mono" value="'+esc(ORG.domain)+'" readonly>'+
    '<div class="fieldhint">'+icon('lock','width:12px;height:12px')+'Managed by your Keystone administrator. It defines who can be a member and is set at org creation — not editable here.</div></div>'+
  '</div>'+
  '<div class="card"><h4>Data &amp; region</h4>'+
   '<div class="field"><label>Default region</label><select class="inp" id="st-region">'+REGIONS.map(x=>'<option'+(ORG.region===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>Data residency</label><select class="inp" id="st-res">'+RESIDENCY.map(x=>'<option'+(ORG.residency===x?' selected':'')+'>'+x+'</option>').join('')+'</select><div class="fieldhint">Where this org\'s data is stored.</div></div>'+
  '</div>'+
  '<div class="dlg-foot" style="justify-content:flex-start"><button class="btn primary" onclick="saveSettings()">Save changes</button><span class="ctxnote" style="align-self:center">Changes are audited. Billing and SSO/SAML are out of scope for v1.</span></div></div>';
}
function saveSettings(){const name=document.getElementById('st-name').value.trim()||ORG.name;const region=document.getElementById('st-region').value;const res=document.getElementById('st-res').value;
 const before={},after={};let changed=false;
 if(name!==ORG.name){before.name=ORG.name;after.name=name;ORG.name=name;changed=true;}
 if(region!==ORG.region){before.region=ORG.region;after.region=region;ORG.region=region;changed=true;}
 if(res!==ORG.residency){before.data_residency=ORG.residency;after.data_residency=res;ORG.residency=res;changed=true;}
 if(!changed){toast('No changes to save.','info');return}
 appendAudit('settings.updated',ORG.name,'org','ui',before,after,'Organization settings updated.');
 render();toast('Settings saved · audited','check');
}

/* ============ Audit (App. G) — read-only org-scope lens ============ */
function auditFiltered(){
 return AUDIT.filter(a=>{
  if(S.aActor!=='all'&&a.actor!==S.aActor)return false;
  if(S.aAction!=='all'&&!a.action.startsWith(S.aAction))return false;
  if(S.aScope!=='all'&&a.scope!==S.aScope)return false;
  if(S.aSource!=='all'&&a.source!==S.aSource)return false;
  if(S.aTime!=='all'&&a.days>Number(S.aTime))return false;
  if(S.aq){const hay=(a.actor+' '+a.action+' '+a.target+' '+(a.detail||'')).toLowerCase();if(!hay.includes(S.aq.toLowerCase()))return false;}
  return true;
 });
}
function auditScreen(r){
 const actors=['all'].concat([...new Set(AUDIT.map(a=>a.actor))]);
 const actions=[['all','All actions'],['member.','member.*'],['project.','project.*'],['label.','label.*'],['settings.','settings.*'],['user.','user.*'],['prompt.','prompt.*']];
 const scopes=[['all','All scopes'],['org','org'],['project','project'],['primitive','primitive'],['user','user']];
 const sources=[['all','UI + API'],['ui','UI'],['api','API']];
 const times=[['all','All time'],['7','Last 7 days'],['30','Last 30 days']];
 const list=auditFiltered();
 const fbar='<div class="fbar">'+
  '<input class="inp" style="width:220px" placeholder="Search actor · action · target…" value="'+esc(S.aq)+'" oninput="S.aq=this.value;render()">'+
  '<select class="selm" onchange="S.aActor=this.value;render()">'+actors.map(a=>'<option value="'+esc(a)+'"'+(S.aActor===a?' selected':'')+'>'+(a==='all'?'All actors':esc(a))+'</option>').join('')+'</select>'+
  '<select class="selm" onchange="S.aAction=this.value;render()">'+actions.map(o=>'<option value="'+o[0]+'"'+(S.aAction===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
  '<select class="selm" onchange="S.aScope=this.value;render()">'+scopes.map(o=>'<option value="'+o[0]+'"'+(S.aScope===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
  '<select class="selm" onchange="S.aSource=this.value;render()">'+sources.map(o=>'<option value="'+o[0]+'"'+(S.aSource===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
  '<select class="selm" onchange="S.aTime=this.value;render()">'+times.map(o=>'<option value="'+o[0]+'"'+(S.aTime===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
  ((S.aActor!=='all'||S.aAction!=='all'||S.aScope!=='all'||S.aSource!=='all'||S.aTime!=='all'||S.aq)?'<button class="btn ghost sm" onclick="clearAuditFilters()">'+icon('x')+'Clear</button>':'')+
  '</div>';
 const W={t:'width:118px',ac:'width:150px',an:'width:200px',tg:'flex:1;min-width:180px',sc:'width:110px',sr:'width:76px'};
 const head='<div class="thead"><div class="th" style="'+W.t+'">Time</div><div class="th" style="'+W.ac+'">Actor</div><div class="th" style="'+W.an+'">Action</div><div class="th" style="'+W.tg+'">Target</div><div class="th" style="'+W.sc+'">Scope</div><div class="th" style="'+W.sr+'">Source</div></div>';
 let rows;
 if(!list.length)rows='<div class="empty">'+icon('search')+'<b>No events match these filters</b><span>Adjust or clear the filter bar above.</span></div>';
 else rows=list.map(a=>{const i=AUDIT.indexOf(a);return '<div class="trow clickable" onclick="eventDlg('+i+')">'+
  '<div class="td ctxnote mono" style="'+W.t+'">'+esc(a.t)+'</div>'+
  '<div class="td" style="'+W.ac+'"><span class="avatar" style="width:20px;height:20px;font-size:8.5px">'+esc(initials(a.actor))+'</span><span class="td trunc" style="font-size:12.5px">'+esc(a.actor)+'</span></div>'+
  '<div class="td mono" style="'+W.an+';font-size:11.5px">'+esc(a.action)+'</div>'+
  '<div class="td" style="'+W.tg+'"><span class="td trunc" style="font-size:12.5px">'+esc(a.target)+'</span></div>'+
  '<div class="td" style="'+W.sc+'"><span class="badge scope-'+a.scope+'"><i></i>'+a.scope+'</span></div>'+
  '<div class="td" style="'+W.sr+'"><span class="badge src-'+a.source+'">'+a.source.toUpperCase()+'</span></div></div>';
 }).join('');
 return '<div class="wrap wide"><div class="sectionhead"><h3>Audit</h3><span class="ctxnote">org-scope lens · reverse-chronological · read-only</span></div>'+
  fbar+
  '<div class="table" style="min-width:900px">'+head+rows+'</div>'+
  '<p class="ctxnote">'+list.length+' of '+AUDIT.length+' events shown. One shared, scope-tagged event stream — this is the org lens, and it can drill into project- and primitive-scope events. The log is <b>immutable</b>: no create, edit, or delete. <b>Export</b> downloads exactly the filtered view.</p></div>';
}
function clearAuditFilters(){S.aq='';S.aActor='all';S.aAction='all';S.aScope='all';S.aSource='all';S.aTime='all';render();}
function kvBlock(obj){if(!obj)return '<span class="ctxnote">—</span>';return '<div class="kv">'+Object.keys(obj).map(k=>'<div><span class="k">'+esc(k)+':</span> '+esc(String(obj[k]))+'</div>').join('')+'</div>';}
function eventDlg(i){const a=AUDIT[i];if(!a)return;
 const hasDiff=a.before||a.after;
 let diff='';
 if(hasDiff){diff='<div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);font-weight:700;margin:2px 0 6px">Change</div>'+
  '<div class="diff"><div class="diffcol before"><div class="dl">Before</div>'+kvBlock(a.before)+'</div>'+
  '<div class="diffarrow">'+icon('arrowRight')+'</div>'+
  '<div class="diffcol after"><div class="dl">After</div>'+kvBlock(a.after)+'</div></div>';}
 openDialog('<h3 class="mono" style="font-size:14px">'+esc(a.action)+'</h3><p class="sub">'+esc(a.t)+' · by '+esc(a.actor)+'</p>'+
  '<div class="card" style="margin:0 0 12px">'+
   '<div class="krow"><b>Target</b><span>'+esc(a.target)+'</span></div>'+
   '<div class="krow"><b>Scope</b><span><span class="badge scope-'+a.scope+'"><i></i>'+a.scope+'</span></span></div>'+
   '<div class="krow"><b>Source</b><span><span class="badge src-'+a.source+'">'+a.source.toUpperCase()+'</span></span></div>'+
   (a.detail?'<div class="krow"><b>Detail</b><span>'+esc(a.detail)+'</span></div>':'')+
  '</div>'+
  diff+
  '<p class="ctxnote">Audit events are immutable — this view is read-only.</p>'+
  '<div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Close</button></div>');
}
function exportAudit(){const n=auditFiltered().length;toast('Exported '+n+' event'+(n===1?'':'s')+' (filtered view) as CSV — mock','download');}

/* ============ menus / dialogs ============ */
function openDialog(html,lg){document.getElementById('overlays').innerHTML='<div class="scrim" onclick="if(event.target===this)closeDlg()"><div class="dialog'+(lg?' lg':'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
 const f=document.querySelector('.dialog input,.dialog select,.dialog button.primary');if(f&&f.tagName==='INPUT')setTimeout(()=>f.focus(),30);}
function closeDlg(){document.getElementById('overlays').innerHTML='';}
function openMenu(e,html){e.stopPropagation();closeMenus();const m=document.createElement('div');m.className='menu';m.innerHTML=html;document.body.appendChild(m);
 const x=Math.min(e.clientX||120,innerWidth-m.offsetWidth-16),y=Math.min(e.clientY||120,innerHeight-m.offsetHeight-10);
 m.style.left=Math.max(8,x)+'px';m.style.top=Math.max(8,y)+'px';}
function openMenuAt(el,html,pos){closeMenus();const m=document.createElement('div');m.className='menu';m.innerHTML=html;document.body.appendChild(m);
 const r=el.getBoundingClientRect();let left=r.left;if(left+m.offsetWidth>innerWidth-8)left=innerWidth-m.offsetWidth-8;
 let top=pos==='above'?(r.top-m.offsetHeight-6):(r.bottom+6);if(top<8)top=8;if(top+m.offsetHeight>innerHeight-8)top=innerHeight-m.offsetHeight-8;
 m.style.left=Math.max(8,left)+'px';m.style.top=top+'px';}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove());}
document.addEventListener('click',()=>closeMenus());

/* ============ command palette (Ctrl/Cmd-K) ============ */
function openCmdk(){S.ksel=0;const items=[
 {g:'Go to',n:'Members',ic:'users',fn:"goOrg('members')"},
 {g:'Go to',n:'Projects',ic:'folder',fn:"goOrg('projects')"},
 {g:'Go to',n:'Labels',ic:'tag',fn:"goOrg('labels')"},
 {g:'Go to',n:'Settings',ic:'sliders',fn:"goOrg('settings')"},
 {g:'Go to',n:'Audit',ic:'activity',fn:"goOrg('audit')"},
 {g:'Do',n:'Add member',ic:'userPlus',fn:'addMemberDlg()'},
 {g:'Do',n:'Create project',ic:'plus',fn:'createProjectDlg()'},
 {g:'Do',n:'New label',ic:'tag',fn:'newLabelDlg()'},
 {g:'Do',n:'Export audit (filtered view)',ic:'download',fn:'exportAudit()'},
 {g:'Do',n:'Back to project ('+S.proj+')',ic:'undo',fn:"goProject(S.proj,'build')"},
 {g:'Do',n:'Toggle light / dark',ic:'sun',fn:"document.documentElement.classList.toggle('dark');render()"}];
 window._K=items;
 document.getElementById('overlays').innerHTML='<div class="scrim" style="padding-top:12vh" onclick="if(event.target===this)closeDlg()"><div class="cmdk"><div class="cin">'+icon('search')+'<input id="ck-in" placeholder="Search the organization…" oninput="drawK(this.value)" autocomplete="off"><kbd>esc</kbd></div><div class="list" id="ck-list"></div><div class="cfoot"><span><kbd>up/down</kbd> navigate</span><span><kbd>enter</kbd> select</span><span><kbd>esc</kbd> close</span></div></div></div>';
 drawK('');document.getElementById('ck-in').focus();}
function kf(q){return window._K.filter(i=>!q||i.n.toLowerCase().includes(q.toLowerCase()));}
function drawK(q){let g='';const l=kf(q);S.ksel=Math.min(S.ksel,Math.max(0,l.length-1));
 document.getElementById('ck-list').innerHTML=l.map((i,x)=>{const gl=i.g!==g?'<div class="glabel">'+i.g+'</div>':'';g=i.g;return gl+'<div class="crow'+(x===S.ksel?' sel':'')+'" onclick="execK('+x+')">'+icon(i.ic)+esc(i.n)+'</div>';}).join('')||'<div class="glabel">No matches</div>';}
function execK(x){const q=document.getElementById('ck-in').value;const it=kf(q)[x];if(!it)return;closeDlg();try{eval(it.fn)}catch(err){}}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();return}
 const ck=document.getElementById('ck-in');
 if(ck){const q=ck.value,n=kf(q).length;
  if(e.key==='ArrowDown'){e.preventDefault();S.ksel=Math.min(n-1,S.ksel+1);drawK(q)}
  if(e.key==='ArrowUp'){e.preventDefault();S.ksel=Math.max(0,S.ksel-1);drawK(q)}
  if(e.key==='Enter'){e.preventDefault();execK(S.ksel)}}
 if(e.key==='Escape'){closeDlg();closeMenus()}});

/* ============ skeleton ============ */
function skelTable(rows,cols){let out='<div class="table"><div class="thead">';
 for(let c=0;c<cols;c++)out+='<div class="th" style="flex:1"><span class="sk" style="width:'+(40+((c*13)%40))+'%;height:9px"></span></div>';
 out+='</div>';
 for(let i=0;i<rows;i++){let cells='';for(let c=0;c<cols;c++)cells+='<span class="sk" style="width:'+(46+((i*7+c*11)%44))+'%;height:13px"></span>';out+='<div class="sk-row" style="justify-content:space-between">'+cells+'</div>';}
 return out+'</div>';}

/* ============ root ============ */
function toggleSB(){const s=document.querySelector('.sidebar');if(s)s.classList.toggle('open');const c=document.querySelector('.sb-scrim');if(c)c.classList.toggle('show');}
function render(){const r=route();let hdr,body;
 if(r.mode==='org'&&S.role!=='org_admin'){
  hdr='<div class="crumb"><span class="cur">No access</span></div><div class="hdr-actions"><button class="iconbtn" title="Search" onclick="openCmdk()">'+icon('search')+'</button></div>';
  body=deniedScreen();
 }else{
  hdr=header(r);
  if(r.mode==='project')body=stageScreen(r);
  else body=({members:membersScreen,projects:projectsScreen,labels:labelsScreen,settings:settingsScreen,audit:auditScreen}[r.surface])(r);
 }
 document.getElementById('app').innerHTML=sidebar(r)+'<div class="sb-scrim" onclick="toggleSB()"></div><div class="main"><header class="header"><button class="hamburger" onclick="toggleSB()" aria-label="Menu">'+icon('menu')+'</button>'+hdr+'</header><div class="content">'+body+'</div></div>';
 if(S.flash){S.flash=false;if(r.mode==='org'&&r.surface==='audit'){const row=document.querySelector('.content .trow');if(row)requestAnimationFrame(()=>row.classList.add('flash'));}}
}
render();
</script>
