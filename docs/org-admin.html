<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone — Organization</title>
<style>
/* ============ shadcn New York token system (sibling of the other Keystone prototypes; v2 fidelity) ============ */
:root{
  --background:#ffffff; --foreground:#020817; --card:#ffffff;
  --primary:#0f172a; --primary-foreground:#f8fafc;
  --secondary:#f1f5f9; --secondary-foreground:#0f172a;
  --muted:#f1f5f9; --muted-foreground:#5b6472;
  --accent:#f1f5f9; --accent-foreground:#0f172a;
  --destructive:#dc2626; --destructive-foreground:#f8fafc;
  --border:#e2e8f0; --input:#7e889c; --ring:#0f172a;
  --success:#15803d; --warning:#b45309; --running:#2563eb;
  --radius:8px;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.44,1); --dur:.17s;
  --elev-1:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.04);
  --shadow-md:0 2px 6px rgba(15,23,42,.08),0 10px 24px -8px rgba(15,23,42,.18);
  --shadow-lg:0 8px 18px rgba(15,23,42,.12),0 28px 56px -16px rgba(15,23,42,.32);
}
.dark{
  --background:#020817; --foreground:#f8fafc; --card:#0b1220;
  --primary:#f8fafc; --primary-foreground:#0f172a;
  --secondary:#16202f; --secondary-foreground:#f8fafc;
  --muted:#111a29; --muted-foreground:#8b96a5;
  --accent:#1a2436; --accent-foreground:#f8fafc;
  --destructive:#f87171; --destructive-foreground:#0f172a;
  --border:#1e293b; --input:#475569; --ring:#94a3b8;
  --success:#4ade80; --warning:#fbbf24; --running:#60a5fa;
  --elev-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 2px 8px rgba(0,0,0,.46),0 14px 30px -8px rgba(0,0,0,.62);
  --shadow-lg:0 10px 22px rgba(0,0,0,.55),0 36px 68px -18px rgba(0,0,0,.74);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.5;background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
input,select{font:inherit;color:inherit}
::placeholder{color:var(--muted-foreground);opacity:.7}
::selection{background:color-mix(in srgb,var(--ring) 32%,transparent)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--input);border-radius:7px;border:3px solid var(--background);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground)}
::-webkit-scrollbar-track{background:transparent}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font-family:var(--mono);font-size:11px;background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted-foreground)}
.ctxnote{font-size:12px;color:var(--muted-foreground)}

/* ============ shell ============ */
#app{display:flex;height:100vh;overflow:hidden}
/* shadcn: Sidebar */
.sidebar{width:240px;flex:none;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border)}
.sb-brand{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.orglogo{width:30px;height:30px;flex:none;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:13px;font-weight:700}
.sb-brand b{font-size:13.5px;display:block;line-height:1.2}
.sb-brand span{font-size:11px;color:var(--muted-foreground);letter-spacing:.06em;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;color:var(--muted-foreground);font-size:13px;font-weight:500;transition:background var(--dur),color var(--dur)}
.nav-item:hover{background:var(--accent);color:var(--foreground)}
.nav-item.on{background:var(--secondary);color:var(--foreground)}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted-foreground);font-family:var(--mono)}
.sb-foot{border-top:1px solid var(--border);padding:10px}
.acct{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:6px;transition:background var(--dur)}
.acct:hover{background:var(--accent)}
.avatar{width:28px;height:28px;flex:none;border-radius:999px;background:var(--secondary);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:700}
.acct-info{flex:1;text-align:left;min-width:0}
.acct-info b{display:block;font-size:13px;line-height:1.2}
.acct-info span{font-size:11px;color:var(--muted-foreground)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{flex:none;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--card)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px}
.crumb a{color:var(--muted-foreground);cursor:pointer}
.crumb a:hover{color:var(--foreground)}
.crumb .sep{color:var(--muted-foreground);opacity:.5}
.crumb .cur{font-weight:600}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;overflow:auto}
.wrap{padding:22px 24px;max-width:1080px}
.wrap.wide{max-width:1180px}

/* ============ buttons (shadcn: Button) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap;transition:background var(--dur),color var(--dur),border-color var(--dur),box-shadow var(--dur),transform .07s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 2px rgba(2,8,23,.22)}
.btn.primary:hover{opacity:.9}
.btn.outline{border-color:var(--input);background:transparent}
.btn.outline:hover{background:var(--accent)}
.btn.ghost:hover{background:var(--accent)}
.btn.destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn.destructive:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;color:var(--muted-foreground);transition:background var(--dur),color var(--dur)}
.iconbtn:hover{background:var(--accent);color:var(--foreground)}

/* ============ badges (shadcn: Badge — New York rounded-md, not pills) ============ */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid;background:transparent;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.owner{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.badge.role{color:var(--muted-foreground);border-color:var(--border)}
.badge.active{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.badge.invited{color:var(--running);border-color:color-mix(in srgb,var(--running) 45%,transparent)}
.badge.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.badge.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.badge.neutral{color:var(--muted-foreground);border-color:var(--border)}
.pill{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;font-size:11px;font-family:var(--mono);background:var(--muted);color:var(--muted-foreground);border:1px solid var(--border)}

/* ============ cards / tables ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--elev-1)}
.card h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px;font-weight:600}
.krow{display:flex;gap:10px;padding:5px 0;font-size:13px}
.krow b{width:150px;flex:none;color:var(--muted-foreground);font-weight:500;font-size:12px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--elev-1)}
.stat .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground)}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px}
.stat .sub{font-size:11px;color:var(--muted-foreground);margin-top:2px}
.sectionhead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.sectionhead h3{font-size:15px;font-weight:600}
.sectionhead .btn{margin-left:auto}
.table{width:100%;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--elev-1);margin-bottom:14px}
.thead{display:flex;align-items:center;background:var(--muted);border-bottom:1px solid var(--border)}
.th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);padding:9px 12px;font-weight:600}
.trow{display:flex;align-items:center;border-bottom:1px solid var(--border);font-size:13px;transition:background var(--dur)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--accent)}
.td{padding:10px 12px;min-width:0;display:flex;align-items:center;gap:8px}
.member-id{display:flex;align-items:center;gap:10px;min-width:0}
.member-id b{font-size:13px}
.member-id .e{font-size:11.5px;color:var(--muted-foreground)}
.rolesel{height:28px;border:1px solid var(--input);border-radius:6px;background:var(--background);font-size:12.5px;padding:0 6px;color:var(--foreground)}
.needs{border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);border-radius:var(--radius);background:color-mix(in srgb,var(--warning) 7%,transparent);padding:12px 14px;margin-bottom:16px}
.needs h4{color:var(--warning);font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;font-weight:700}
.needrow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.needrow .btn{margin-left:auto}
.dcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:var(--elev-1)}
.dcard.red{border-color:color-mix(in srgb,var(--destructive) 55%,transparent)}
.dcard .info{flex:1}.dcard b{font-size:13.5px}.dcard p{font-size:12.5px;color:var(--muted-foreground)}
.ledger{display:flex;align-items:flex-end;gap:5px;height:56px;margin:10px 0}
.ledger i{flex:1;background:var(--running);opacity:.75;border-radius:3px 3px 0 0;min-height:4px}
.budget{height:8px;border-radius:99px;background:var(--muted);overflow:hidden;margin:8px 0 4px}
.budget i{display:block;height:100%;border-radius:99px;background:var(--success)}
.budget i.over{background:var(--warning)}
.mono-key{font-family:var(--mono);font-size:12px}
.provlogo{width:26px;height:26px;flex:none;border-radius:6px;background:var(--muted);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 20px;color:var(--muted-foreground);text-align:center}
.empty svg.ic{width:30px;height:30px;opacity:.5}

/* ============ menus / dialogs / cmdk / toasts ============ */
.menu{position:fixed;z-index:300;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);padding:5px;font-size:13px;animation:ovmenu .14s var(--ease);transform-origin:top}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;text-align:left;transition:background var(--dur)}
.menu .mi:hover{background:var(--accent)}
.menu .mi.danger{color:var(--destructive)}
.menu .msep{height:1px;background:var(--border);margin:5px 4px}
.scrim{position:fixed;inset:0;z-index:400;background:rgba(2,8,23,.62);display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;animation:fade .16s ease-out}
.dialog{width:470px;max-width:92vw;max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:22px;animation:ovdlg .2s var(--ease)}
.dialog h3{font-size:16px;margin-bottom:4px}
.dialog .sub{font-size:13px;color:var(--muted-foreground);margin-bottom:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px;color:var(--muted-foreground)}
.inp{width:100%;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--input);background:var(--background);font-size:13px}
.inp:focus{outline:2px solid var(--ring);outline-offset:-1px}
select.inp{appearance:auto}
.warnbox{border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);background:color-mix(in srgb,var(--warning) 8%,transparent);color:var(--warning);border-radius:6px;padding:9px 11px;font-size:12px;display:flex;gap:8px;margin-bottom:12px}
.cmdk{width:560px;max-width:92vw;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;animation:ovdlg .18s var(--ease)}
.cmdk .cin{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.cmdk input{flex:1;background:none;border:none;outline:none;font-size:14px}
.cmdk .list{max-height:44vh;overflow-y:auto;padding:7px}
.cmdk .glabel{font-size:11px;color:var(--muted-foreground);padding:7px 10px 3px;font-weight:600}
.cmdk .crow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.cmdk .crow:hover,.cmdk .crow.sel{background:var(--accent)}
.cmdk .cfoot{display:flex;gap:14px;padding:9px 15px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-foreground)}
#toasts{position:fixed;bottom:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:11px 14px;font-size:13px;animation:tin .18s ease-out;max-width:400px}
.toast-act{margin-left:4px;font-weight:600;color:var(--running);padding:2px 9px;border-radius:5px}
.toast-act:hover{background:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ovdlg{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ovmenu{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,var(--muted) 25%,var(--accent) 40%,var(--muted) 60%);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:6px;height:12px;display:inline-block}
.sk-row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-bottom:1px solid var(--border)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlays"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ============ icons (lucide-style) ============ */
const ICONS={
search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
chevD:'<polyline points="6 9 12 15 18 9"/>',
check:'<polyline points="4 12 10 18 20 6"/>',
x:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
more:'<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><polyline points="3 8 12 13 21 8"/><line x1="12" y1="13" x2="12" y2="22"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M22 19c0-2.5-2-4.5-4.5-4.7"/>',
userPlus:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 12L21 2"/><path d="M17 6l3 3"/>',
plug:'<path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
alertT:'<path d="M10.3 3.8L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="16.6" r=".6" fill="currentColor" stroke="none"/>',
shieldCheck:'<path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10z"/><polyline points="9 11.5 11.5 14 15.5 9"/>',
sliders:'<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/>',
gauge:'<path d="M12 13l4-4"/><path d="M3 18a9 9 0 1 1 18 0"/>',
trash:'<path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13h10l1-13"/>',
rotate:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2 7 12 13 22 7"/>',
download:'<path d="M12 4v12"/><polyline points="6 10 12 16 18 10"/><path d="M4 20h16"/>',
external:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>'};
function icon(n,s){return '<svg class="ic" viewBox="0 0 24 24"'+(s?' style="'+s+'"':'')+'>'+(ICONS[n]||ICONS.box)+'</svg>'}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m,ic,action){const t=document.createElement('div');t.className='toast';t.innerHTML=icon(ic||'check')+'<span>'+esc(m)+'</span>';
 if(action){const b=document.createElement('button');b.className='toast-act';b.textContent=action.label;b.onclick=()=>{action.fn();t.remove()};t.appendChild(b)}
 document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),action?5200:2900)}

/* ============ data — the acme org ============ */

 APIKEYS.map((k,i)=>'<div class="trow"><div class="td" style="'+W.n+'"><b>'+esc(k.name)+'</b></div><div class="td mono ctxnote" style="'+W.p+'">'+k.prefix+'…••••</div><div class="td ctxnote" style="'+W.c+'">'+k.created+'</div><div class="td ctxnote" style="'+W.l+'">'+k.last+'</div><div class="td" style="'+W.x+'"><button class="iconbtn" onclick="keyMenu(event,'+i+')">'+icon('more')+'</button></div></div>').join('')+'</div></div>'}
function keyMenu(e,i){openMenu(e,'<button class="mi danger" onclick="closeMenus();APIKEYS.splice('+i+',1);render();toast(\'Key revoked · audited\',\'trash\')">'+icon('trash')+'Revoke</button>')}
function createKeyDlg(){openDialog('<h3>Create API key</h3><div class="field"><label>Name</label><input class="inp" id="k-n" placeholder="my-integration"></div><div class="warnbox">'+icon('alertT','width:14px;height:14px')+'The full key is shown once, right after creation. Store it now.</div><div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="var n=document.getElementById(\'k-n\').value||\'new-key\';APIKEYS.unshift({name:n,prefix:\'ks_live_new0\',created:\'just now\',last:\'never\'});closeDlg();render();toast(\'Created \'+n+\' — key shown once (mock)\',\'key\')">Create key</button></div>')}

function auditScreen(){
 const list=AUDIT.filter(a=>!S.q||JSON.stringify(a).toLowerCase().includes(S.q.toLowerCase()));
 return '<div class="wrap wide"><div class="sectionhead"><h3>Audit</h3><input class="inp" style="width:200px;height:30px" placeholder="Search events…" value="'+esc(S.q)+'" oninput="S.q=this.value;render()"><button class="btn outline sm" onclick="toast(\'Exported filtered view (CSV, mock)\',\'download\')">'+icon('download')+'Export</button></div>'+
 '<div class="table"><div class="thead"><div class="th" style="width:120px">Time</div><div class="th" style="width:120px">Actor</div><div class="th" style="width:190px">Action</div><div class="th" style="flex:1">Target · detail</div></div>'+
 list.map(a=>{const op=a.action.startsWith('operator.');return '<div class="trow"><div class="td ctxnote" style="width:120px">'+a.t+'</div><div class="td" style="width:120px">'+(op?'<span class="badge warn"><i></i>operator</span>':esc(a.actor))+'</div><div class="td mono" style="width:190px;font-size:11.5px">'+esc(a.action)+'</div><div class="td" style="flex:1"><b style="font-size:12.5px">'+esc(a.target)+'</b> <span class="ctxnote">— '+esc(a.detail)+'</span></div></div>'}).join('')+'</div>'+
 '<p class="ctxnote">Read-only, immutable. The <b>operator.entered_org</b> row is the transparency record of a platform operator\'s audited governance session.</p></div>'}

function skelTable(n){let r='';for(let i=0;i<n;i++){r+='<div class="sk-row" style="justify-content:space-between"><span class="sk" style="width:200px;height:14px"></span><span class="sk" style="width:110px"></span><span class="sk" style="width:90px"></span><span class="sk" style="width:90px"></span></div>'}return '<div class="table">'+r+'</div>'}

/* ============ dialogs / menus ============ */
function openDialog(html){document.getElementById('overlays').innerHTML='<div class="scrim" onclick="if(event.target===this)closeDlg()"><div class="dialog" role="dialog">'+html+'</div></div>'}
function closeDlg(){document.getElementById('overlays').innerHTML=''}
function openMenu(e,html){e.stopPropagation();closeMenus();const m=document.createElement('div');m.className='menu';m.innerHTML=html;document.body.appendChild(m);
 const x=Math.min(e.clientX||100,innerWidth-m.offsetWidth-16),y=Math.min(e.clientY||100,innerHeight-m.offsetHeight-10);m.style.left=Math.max(8,x)+'px';m.style.top=Math.max(8,y)+'px'}

/* ============ command palette ============ */
function openCmdk(){S.ksel=0;const items=NAV.map(t=>({g:'Go to',n:t[1],ic:t[2],fn:"go('#/"+t[0]+"')"}))
 .concat([{g:'Do',n:'Invite member',ic:'userPlus',fn:'inviteDlg()'},{g:'Do',n:'Add secret',ic:'lock',fn:'addSecretDlg()'},{g:'Do',n:'Create API key',ic:'key',fn:'createKeyDlg()'},{g:'Do',n:'Create project',ic:'folder',fn:'createProjectDlg()'},{g:'Do',n:'Toggle light / dark',ic:'sun',fn:"document.documentElement.classList.toggle('dark');render()"}]);
 window._K=items;
 document.getElementById('overlays').innerHTML='<div class="scrim" style="padding-top:12vh" onclick="if(event.target===this)closeDlg()"><div class="cmdk"><div class="cin">'+icon('search')+'<input id="ck-in" placeholder="Search the organization…" oninput="drawK(this.value)" autocomplete="off"><kbd>esc</kbd></div><div class="list" id="ck-list"></div><div class="cfoot"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div></div></div>';
 drawK('');document.getElementById('ck-in').focus()}
function kf(q){return window._K.filter(i=>!q||i.n.toLowerCase().includes(q.toLowerCase()))}
function drawK(q){let g='';const l=kf(q);S.ksel=Math.min(S.ksel,Math.max(0,l.length-1));
 document.getElementById('ck-list').innerHTML=l.map((i,x)=>{const gl=i.g!==g?'<div class="glabel">'+i.g+'</div>':'';g=i.g;return gl+'<div class="crow'+(x===S.ksel?' sel':'')+'" onclick="execK('+x+')">'+icon(i.ic)+esc(i.n)+'</div>'}).join('')||'<div class="glabel">No matches</div>'}
function execK(x){const q=document.getElementById('ck-in').value;const it=kf(q)[x];if(!it)return;closeDlg();try{eval(it.fn)}catch(e){}}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();return}
 const ck=document.getElementById('ck-in');
 if(ck){const q=ck.value,n=kf(q).length;
  if(e.key==='ArrowDown'){e.preventDefault();S.ksel=Math.min(n-1,S.ksel+1);drawK(q)}
  if(e.key==='ArrowUp'){e.preventDefault();S.ksel=Math.max(0,S.ksel-1);drawK(q)}
  if(e.key==='Enter'){e.preventDefault();execK(S.ksel)}}
 if(e.key==='Escape'){closeDlg();closeMenus()}});

/* ============ root ============ */
function render(){const r=route();
 const titles={overview:'Overview',members:'Members',projects:'Projects',secrets:'Secrets',connections:'Connections',billing:'Billing',apikeys:'API keys',audit:'Audit'};
 const hdr='<div class="crumb"><a onclick="go(\'#/overview\')">'+esc(ORG.name)+'</a><span class="sep">▸</span><span class="cur">'+titles[r.scr]+'</span></div><div class="hdr-actions"><button class="iconbtn" title="Search (⌘K)" onclick="openCmdk()">'+icon('search')+'</button></div>';
 const body={overview:overviewScreen,members:membersScreen,projects:projectsScreen,secrets:secretsScreen,connections:connectionsScreen,billing:billingScreen,apikeys:apikeysScreen,audit:auditScreen}[r.scr]();
 document.getElementById('app').innerHTML=sidebar(r)+'<div class="main"><header class="header">'+hdr+'</header><div class="content">'+body+'</div></div>'}
render();
</script>
