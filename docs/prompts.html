<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone — Prompts</title>
<style>
/* v2 — shadcn New York fidelity pass */
/* ============ shadcn New York token system (from Keystone-Admin-Prototype) ============ */
:root{
  --background:#ffffff; --foreground:#020817; --card:#ffffff; --card-foreground:#020817;
  --primary:#0f172a; --primary-foreground:#f8fafc;
  --secondary:#f1f5f9; --secondary-foreground:#0f172a;
  --muted:#f1f5f9; --muted-foreground:#5b6472;
  --accent:#f1f5f9; --accent-foreground:#0f172a;
  --destructive:#dc2626; --destructive-foreground:#f8fafc;
  --border:#e2e8f0; --input:#7e889c; --ring:#0f172a;
  --success:#15803d; --warning:#b45309; --running:#2563eb;
  --env-prod:#15803d; --env-stag:#b45309; --env-dev:#2563eb; --env-draft:#64748b;
  --radius:8px;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --shadow-md:0 4px 12px -2px rgba(2,8,23,.12);
  --shadow-lg:0 12px 32px -8px rgba(2,8,23,.24);
}
.dark{
  --background:#020817; --foreground:#f8fafc; --card:#0b1220; --card-foreground:#f8fafc;
  --primary:#f8fafc; --primary-foreground:#0f172a;
  --secondary:#16202f; --secondary-foreground:#f8fafc;
  --muted:#111a29; --muted-foreground:#8b96a5;
  --accent:#1a2436; --accent-foreground:#f8fafc;
  --destructive:#f87171; --destructive-foreground:#0f172a;
  --border:#1e293b; --input:#475569; --ring:#94a3b8;
  --success:#4ade80; --warning:#fbbf24; --running:#60a5fa;
  --env-prod:#4ade80; --env-stag:#fbbf24; --env-dev:#60a5fa; --env-draft:#94a3b8;
  --shadow-md:0 4px 12px -2px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.5;background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
::placeholder{color:var(--muted-foreground);opacity:.7}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font-family:var(--mono);font-size:11px;background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted-foreground)}

/* ============ App shell ============ */
#app{display:flex;height:100vh;overflow:hidden}
/* shadcn: Sidebar */
.sidebar{width:240px;flex:none;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border);transition:width .15s}
.sidebar.rail{width:56px}
.sidebar.rail .sb-label,.sidebar.rail .proj-name,.sidebar.rail .acct-info,.sidebar.rail .nav-txt{display:none}
.sb-top{padding:12px;border-bottom:1px solid var(--border)}
.proj-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--background)}
.proj-btn:hover{background:var(--accent)}
.proj-logo{width:22px;height:22px;flex:none;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;font-weight:700}
.proj-name{flex:1;text-align:left;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;color:var(--muted-foreground);font-size:13px;font-weight:500}
.nav-item:hover{background:var(--accent);color:var(--foreground)}
.nav-item.on{background:var(--secondary);color:var(--foreground)}
.sb-foot{border-top:1px solid var(--border);padding:10px}
.acct{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:6px}
.acct:hover{background:var(--accent)}
/* shadcn: Avatar */
.avatar{width:28px;height:28px;flex:none;border-radius:999px;background:var(--secondary);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:700}
.acct-info{flex:1;text-align:left;min-width:0}
.acct-info b{display:block;font-size:13px;line-height:1.2}
.acct-info span{font-size:11px;color:var(--muted-foreground)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{flex:none;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--card);overflow-x:auto;overflow-y:hidden}
.header>*{flex-shrink:0}
.header .hdr-actions{flex-shrink:0}
/* shadcn: Breadcrumb */
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;min-width:0}
.crumb a{color:var(--muted-foreground);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--foreground)}
.crumb .sep{color:var(--muted-foreground);opacity:.5}
.crumb .cur{font-weight:600;white-space:nowrap}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;overflow:auto;overflow-x:hidden;position:relative}

/* ============ Buttons (shadcn: Button) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{opacity:.9}
.btn.outline{border-color:var(--input);background:transparent}
.btn.outline:hover{background:var(--accent)}
.btn.ghost:hover{background:var(--accent)}
.btn.destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn.destructive:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.icon{width:34px;padding:0}
.btn.icon.sm{width:28px}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;color:var(--muted-foreground)}
.iconbtn:hover{background:var(--accent);color:var(--foreground)}
.iconbtn.on{background:var(--secondary);color:var(--foreground)}
.toolbar{display:flex;align-items:center;gap:2px}
.toolbar .div{width:1px;height:18px;background:var(--border);margin:0 6px}

/* ============ Badges & pills ============ */
/* shadcn: Badge */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--secondary);color:var(--secondary-foreground);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.outline{background:transparent;border:1px solid var(--border);color:var(--muted-foreground)}
.envb{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid;background:transparent;white-space:nowrap}
.envb i{width:6px;height:6px;border-radius:99px;background:currentColor}
.envb.production{color:var(--env-prod);border-color:color-mix(in srgb,var(--env-prod) 45%,transparent)}
.envb.staging{color:var(--env-stag);border-color:color-mix(in srgb,var(--env-stag) 45%,transparent)}
.envb.dev{color:var(--env-dev);border-color:color-mix(in srgb,var(--env-dev) 45%,transparent)}
.envb.draft{color:var(--env-draft);border-color:color-mix(in srgb,var(--env-draft) 45%,transparent)}
.tagpill{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font-size:11px;font-family:var(--mono);background:var(--muted);color:var(--muted-foreground);border:1px solid var(--border);white-space:nowrap}
.statdot{width:8px;height:8px;border-radius:99px;flex:none}
.statdot.ok{background:var(--success)} .statdot.err{background:var(--destructive)} .statdot.run{background:var(--running)} .statdot.none{background:var(--muted-foreground);opacity:.4}

/* ============ Table (shadcn: Table) ============ */
.tablewrap{padding:20px 24px}
.table{width:100%;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.thead{display:flex;align-items:center;background:var(--muted);border-bottom:1px solid var(--border)}
.th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);padding:9px 12px;font-weight:500}
.trow{display:flex;align-items:center;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--accent)}
.td{padding:11px 12px;font-size:13px;min-width:0;display:flex;align-items:center;gap:6px}
.rowrun{position:absolute;right:44px;top:50%;transform:translateY(-50%);display:none}
.trow:hover .rowrun{display:inline-flex}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:64px 20px;color:var(--muted-foreground);text-align:center}
.empty svg.ic{width:32px;height:32px;opacity:.5}

/* ============ Menus (shadcn: DropdownMenu) ============ */
.menu{position:fixed;z-index:300;min-width:190px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:5px;font-size:13px}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;text-align:left}
.menu .mi:hover{background:var(--accent)}
.menu .mi.danger{color:var(--destructive)}
.menu .msep{height:1px;background:var(--border);margin:5px 4px}
.menu .mlabel{font-size:11px;color:var(--muted-foreground);padding:4px 9px}

/* ============ Dialogs (shadcn: Dialog) ============ */
.scrim{position:fixed;inset:0;z-index:400;background:rgba(2,8,23,.6);display:none;align-items:flex-start;justify-content:center;padding-top:9vh}
.scrim.show{display:flex}
.dialog{width:480px;max-width:92vw;max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:22px}
.dialog.wide{width:840px}
.dialog h3{font-size:16px;margin-bottom:4px}
.dialog .sub{font-size:13px;color:var(--muted-foreground);margin-bottom:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
/* shadcn: Input */
.inp{width:100%;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--input);background:var(--background);font-size:13px}
.inp:focus,textarea:focus{outline:2px solid var(--ring);outline-offset:-1px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px;color:var(--muted-foreground)}
select.inp{appearance:auto}

/* ============ Tabs (shadcn: Tabs) ============ */
.tabs{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.tab{height:28px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted-foreground)}
.tab:hover{color:var(--foreground)}
.tab.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{height:28px;padding:0 12px;font-size:12.5px;color:var(--muted-foreground);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--secondary);color:var(--foreground);font-weight:600}

/* ============ Editor layout ============ */
.editor{display:flex;height:100%;min-height:0}
.canvas{flex:1;overflow-y:auto;padding:22px 26px;min-width:0}
.inspector{width:320px;flex:none;overflow-y:auto;border-left:1px solid var(--border);background:var(--card);padding:16px}
/* shadcn: Card */
.card{background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px;font-weight:600}
.port{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:12.5px}
.port .mono{color:var(--running)}
.port .pk{margin-left:auto;font-size:10.5px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em}
/* shadcn: ToggleGroup */
.tgl{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.tgl button{flex:1;height:30px;font-size:12.5px;color:var(--muted-foreground);border-right:1px solid var(--border)}
.tgl button:last-child{border-right:none}
.tgl button.on{background:var(--secondary);color:var(--foreground);font-weight:600}
.budgetbar{height:6px;border-radius:99px;background:var(--muted);overflow:hidden;margin:8px 0 6px}
.budgetbar i{display:block;height:100%;border-radius:99px;background:var(--running)}

/* message segments */
.seg-msg{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);margin-bottom:12px;overflow:hidden}
.seg-h{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--muted);border-bottom:1px solid var(--border)}
.rolechip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:5px}
.rolechip.system{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.rolechip.user{background:color-mix(in srgb,var(--running) 16%,transparent);color:var(--running)}
.rolechip.assistant{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.seg-h .hint{font-size:11px;color:var(--muted-foreground)}
.seg-h .iconbtn{margin-left:auto;width:24px;height:24px}
/* highlighted editor: transparent textarea over rendered backdrop */
.hl{position:relative;font-family:var(--mono);font-size:13px;line-height:1.6}
.hl .bd,.hl textarea{padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;width:100%;border:none;background:transparent;font:inherit;line-height:inherit;min-height:64px}
.hl .bd{position:absolute;inset:0;pointer-events:none;color:var(--foreground)}
.hl textarea{position:relative;resize:vertical;display:block;color:transparent;caret-color:var(--foreground);outline:none}
.hl .var{color:var(--running);font-weight:600}
.hl .refc{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent);border-radius:4px;padding:0 3px;font-weight:600}
.hl .refc.miss{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 14%,transparent)}
.phchip{display:flex;align-items:center;gap:9px;border:1px dashed var(--input);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;background:var(--muted);font-family:var(--mono);font-size:12.5px}
.phchip b{color:var(--running)}
.addrow{display:flex;gap:8px;margin-top:6px}

/* quick run panel */
.qr{position:absolute;top:0;right:0;bottom:0;width:380px;background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);padding:16px;overflow-y:auto;transform:translateX(105%);transition:transform .18s;z-index:60}
.qr.show{transform:none}
.qr h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qr .out{border:1px dashed var(--input);border-radius:var(--radius);min-height:110px;padding:12px;font-size:13px;color:var(--muted-foreground);background:var(--background)}
.qr .out.filled{color:var(--foreground);border-style:solid;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.metrics{display:flex;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--muted-foreground);margin-top:8px}
.attach{display:flex;gap:6px;align-items:center;border:1px dashed var(--input);border-radius:6px;padding:8px;font-size:12px;color:var(--muted-foreground)}
.attach .chip{display:inline-flex;gap:5px;align-items:center;background:var(--muted);border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11.5px;color:var(--foreground)}

/* ============ Run mode ============ */
.runwrap{padding:20px 24px}
.resulttable{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.rrow{display:flex;align-items:center;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.rrow:hover{background:var(--accent)}
.rrow:last-child{border-bottom:none}
.rcell{padding:9px 12px;min-width:0;display:flex;align-items:center;gap:8px}
.outprev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12px}
.cmp{display:grid;gap:14px;margin-top:14px}
.cmpcol{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.cmpcol .ch{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmpcell{padding:12px;border-bottom:1px solid var(--border);font-size:12.5px;font-family:var(--mono);white-space:pre-wrap}
.cmpcell:last-child{border-bottom:none}
.win{border:1px solid var(--success);color:var(--success);border-radius:5px;font-size:11px;padding:1px 7px;display:inline-flex;gap:4px;align-items:center}
.diffadd{background:color-mix(in srgb,var(--success) 22%,transparent);border-radius:3px}
.diffdel{background:color-mix(in srgb,var(--destructive) 22%,transparent);text-decoration:line-through;border-radius:3px}
.timeline{margin-top:8px}
.tl{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:7px;font-family:var(--mono)}
.tl .bar{height:8px;border-radius:4px;background:var(--running);opacity:.85}
.tl .nm{width:150px;color:var(--muted-foreground);flex:none}

/* ============ Compress ============ */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.mcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:14px;cursor:pointer}
.mcard:hover{border-color:var(--input)}
.mcard.on{border-color:var(--ring);outline:1px solid var(--ring)}
.mcard b{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:5px}
.mcard p{font-size:12px;color:var(--muted-foreground)}
.stats{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);margin-bottom:12px}
.stat{flex:1;padding:11px 14px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground)}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px}
.stat .v.good{color:var(--success)}
.cprev{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px;font-family:var(--mono);font-size:13px;line-height:1.7;white-space:pre-wrap}
.cprev .cut{color:var(--muted-foreground);opacity:.55;text-decoration:line-through}
.cprev .keepvar{color:var(--running);font-weight:700;background:color-mix(in srgb,var(--running) 12%,transparent);border-radius:3px;padding:0 2px}
.cprev .keepref{color:var(--success);font-weight:700;background:color-mix(in srgb,var(--success) 12%,transparent);border-radius:3px;padding:0 2px}
/* slider */
input[type=range]{width:100%;accent-color:var(--primary)}

/* ============ Manage ============ */
.managewrap{padding:22px 26px;max-width:880px}
.msec{margin-bottom:22px}
.msec>h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.vrow:last-child{border-bottom:none}
.member{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.member:last-child{border-bottom:none}
.dcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.dcard.red{border-color:color-mix(in srgb,var(--destructive) 55%,transparent)}
.dcard .info{flex:1}
.dcard b{font-size:13.5px}
.dcard p{font-size:12.5px;color:var(--muted-foreground)}

/* ============ Command palette (shadcn: Command) ============ */
.cmdk{width:600px;max-width:92vw;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.cmdk .cin{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.cmdk input{flex:1;background:none;border:none;outline:none;font-size:14px}
.cmdk .list{max-height:46vh;overflow-y:auto;padding:7px}
.cmdk .glabel{font-size:11px;color:var(--muted-foreground);padding:7px 10px 3px;font-weight:600}
.cmdk .crow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.cmdk .crow:hover,.cmdk .crow.sel{background:var(--accent)}

function hl(s){let h=esc(s);h=h.replace(/\[\[ref:([\w-]+)\]\]/g,(m,n)=>'<span class="refc'+(byId(n)?'':' miss')+'">'+n+(byId(n)?'':' · missing')+'</span>');h=h.replace(/\{\{\s*[\w.]+\s*\}\}/g,m=>'<span class="var">'+m+'</span>');return h+'\n'}
function envBadge(e){return e?'<span class="envb '+e+'"><i></i>'+e+'</span>':'<span class="ctxnote">—</span>'}
function highestEnv(p){const order=['production','staging','dev','draft'];for(const e of order){if(p.versions.some(v=>v.tag===e))return e}return null}
function model(id){return MODELS.find(m=>m.id===id)||MODELS[0]}
function classify(text){const t=text.toLowerCase();if(/invoice|charge|refund|billing|download/.test(t))return 'billing';if(/sign in|crash|csv|two-factor|password|codes/.test(t))return 'technical';if(/account|plan|upgrade|close/.test(t))return 'account';return 'other'}
function diffWords(a,b){const A=a.split(/\s+/),B=b.split(/\s+/);const n=A.length,m=B.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0;const out=[];while(i<n&&j<m){if(A[i]===B[j]){out.push(esc(A[i]));i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push('<span class="diffdel">'+esc(A[i])+'</span>');i++}else{out.push('<span class="diffadd">'+esc(B[j])+'</span>');j++}}while(i<n)out.push('<span class="diffdel">'+esc(A[i++])+'</span>');while(j<m)out.push('<span class="diffadd">'+esc(B[j++])+'</span>');return out.join(' ')}

 else prev='<span class="ctxnote">Pick a method and target, then press Compress. {{variables}} and references are always protected — never removed.</span>';
 return '<div class="canvas" style="padding:22px 26px"><div class="addrow" style="margin-bottom:14px"><b style="font-size:15px">'+icon('shrink')+' Compress prompt</b><span class="ctxnote" style="align-self:center">shortens the prompt; meaning kept, slots protected</span></div>'+
 '<div class="methods">'+methods.map(m=>'<div class="mcard'+(C.method===m[0]?' on':'')+'" onclick="S.compress.method=\''+m[0]+'\';S.compress.done=null;render()"><b>'+icon('shrink')+m[1]+'</b><p>'+m[2]+'</p></div>').join('')+'</div>'+
 (C.method==='longllmlingua'?'<div class="field" style="max-width:520px"><label>Question (what should the compressed prompt still answer?)</label><input class="inp" id="cq" placeholder="e.g. what tone should the reply use?"></div>':'')+
 '<div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="tgl" style="width:260px"><button class="'+(C.target==='rate'?'on':'')+'" onclick="S.compress.target=\'rate\';render()">Keep-rate</button><button class="'+(C.target==='tok'?'on':'')+'" onclick="S.compress.target=\'tok\';render()">Target tokens</button></div>'+
 (C.target==='rate'?'<div style="flex:1;min-width:220px"><label class="ctxnote">keep ~<b id="crv">'+C.rate+'</b>%</label><input type="range" min="20" max="95" value="'+C.rate+'" oninput="S.compress.rate=+this.value;document.getElementById(\'crv\').textContent=this.value"></div>':'<input class="inp" style="width:130px" value="'+C.tok+'" onchange="S.compress.tok=+this.value">')+
 '<label style="display:flex;gap:7px;align-items:center;font-size:12.5px"><input type="checkbox" '+(C.digits?'checked':'')+' onchange="S.compress.digits=this.checked"> Preserve digits</label>'+
 '<button class="btn '+(C.done?'outline':'primary')+'" onclick="doCompress()">'+icon('shrink')+(C.done?'Re-compress':'Compress')+'</button></div>'+stats+
 '<div class="cprev">'+prev+'</div>'+
 '<div class="dlg-foot" style="justify-content:flex-start"><button class="btn outline" onclick="toggleCompress()">Cancel</button><button class="btn primary" '+(C.done?'':'disabled')+' onclick="applyCompress()">'+icon('check')+'Apply compression</button></div></div>'}
function doCompress(){const p=byId(route().id);const C=S.compress;const src=tpl(p);
 const raw=src.split(/\s+/).filter(Boolean);const parts=raw.map(w=>{if(/^\{\{.*\}\}[.,:]?$/.test(w))return{t:w,p:'var'};if(/^\[\[ref:.*\]\]$/.test(w))return{t:w,p:'ref'};if(C.digits&&/\d/.test(w))return{t:w,p:'num'};return{t:w}});
 const free=parts.filter(x=>!x.p);const keepGoal=C.target==='rate'?Math.round(raw.length*C.rate/100):Math.min(raw.length,Math.round(C.tok/1.33));
 let toCut=Math.max(0,raw.length-keepGoal);
 for(const x of free){if(toCut<=0)break;if(STOPW.has(x.t.toLowerCase().replace(/[^\w]/g,''))){x.cut=true;toCut--}}
 for(let i=0;i<free.length&&toCut>0;i+=2){if(!free[i].cut){free[i].cut=true;toCut--}}
 const before=tokEst(src);const after=tokEst(parts.filter(x=>!x.cut).map(x=>x.t).join(' '));
 C.done={parts,before,after};render();toast('Compressed — review the preview, protected slots untouched','shrink')}
function applyCompress(){const p=byId(route().id);const C=S.compress;if(!C.done)return;const nt=C.done.parts.filter(x=>!x.cut).map(x=>x.t).join(' ');
 snapUndo();if(p.kind==='chat'){p.messages=[{role:'system',text:nt}]}else p.body=nt;
 p.version++;p.versions.unshift({v:p.version,tag:null,when:'just now',author:'Amaan K',note:'Applied '+C.method+' compression (−'+Math.round((C.done.before-C.done.after)/C.done.before*100)+'%)',tpl:nt});
 S.compress=null;render();toast('Applied as v'+p.version+' — old version kept in history','save')}

 '<div class="msec"><h3>'+icon('file')+'Details</h3><div class="card"><div class="field"><label>Name</label><input class="inp" value="'+esc(p.name)+'" onchange="commitRename(\''+p.id+'\',this.value)"></div><div class="field"><label>Description</label><input class="inp" value="'+esc(p.desc)+'" onchange="byId(\''+p.id+'\').desc=this.value;toast(\'Description saved\')"></div><div class="field"><label>Labels</label><div class="addrow" style="flex-wrap:wrap">'+p.labels.map((l,i)=>'<span class="tagpill">'+esc(l)+' <a style="cursor:pointer;margin-left:4px" onclick="byId(\''+p.id+'\').labels.splice('+i+',1);render()">✕</a></span>').join('')+'<button class="btn ghost sm" onclick="labelsDlg(\''+p.id+'\')">'+icon('tag')+'Manage tags</button></div></div></div></div>'+
 '<div class="msec"><h3>'+icon('clock')+'Versions</h3>'+vers+'</div>'+
 (p.evaluator?'<div class="msec"><h3>'+icon('flask')+'Evaluators</h3><div class="card"><b style="font-size:13px">Used as an LLM judge</b><p class="ctxnote">This prompt grades outputs of other prompts in Evaluate ▸ Experiments (escalation-risk rubric).</p></div></div>':'')+
 '<div class="msec"><h3>'+icon('db')+'Associated datasets</h3><div class="card">'+(p.id==='support-triage'?'<div class="port">'+icon('db')+'<span>helpdesk-tickets-2026-06</span><span class="pk">50 rows · read-only</span></div>':'<p class="ctxnote">No datasets linked yet — capture batch results to create one.</p>')+'</div></div>'+
 '<div class="msec"><h3>'+icon('users')+'Access</h3>'+acc+'</div>'+
 '<div class="msec"><h3>'+icon('sliders')+'Settings</h3>'+
 '<div class="dcard"><div class="info"><b>Archive this prompt</b><p>Hidden from the list; history preserved; restorable anytime.</p></div><button class="btn outline" onclick="archiveDlg(\''+p.id+'\')">'+icon('archive')+(p.archived?'Unarchive':'Archive')+'</button></div>'+
 '<div class="dcard red"><div class="info"><b>Delete this prompt</b><p>Permanently deletes '+esc(p.name)+' and all its versions. Cannot be undone.</p></div><button class="btn destructive" onclick="deleteDlg(\''+p.id+'\')">'+icon('trash')+'Delete</button></div>'+
 '<div class="dcard"><div class="info"><b>Optimize with DSPy</b><p>Machine-search better wordings against a metric — opens the Learn feature.</p></div><button class="btn outline" onclick="toast(\'Optimize flow lives in Learn — out of scope for this mock\',\'sparkles\')">'+icon('sparkles')+'Optimize</button></div></div></div>'}
function verMenu(e,id,v){openMenu(e,'<button class="mi" onclick="closeMenus();diffDlg(\''+id+'\','+v+')">'+icon('cols')+'Diff vs current</button><button class="mi" onclick="closeMenus();restoreVer(\''+id+'\','+v+')">'+icon('undo')+'Restore</button><button class="mi" onclick="closeMenus();promoteDlg(\''+id+'\','+v+')">'+icon('upload')+'Promote</button>')}

function restoreVer(id,v){const p=byId(id);const old=p.versions.find(x=>x.v===v);p.version++;p.versions.unshift({v:p.version,tag:null,when:'just now',author:'Amaan K',note:'Restored from v'+v,tpl:old.tpl});
 if(p.kind==='text')p.body=old.tpl.split('\n\n').pop();toast('Restored v'+v+' as v'+p.version+' — nothing was overwritten','undo');render()}
function diffDlg(id,v){const p=byId(id);const old=p.versions.find(x=>x.v===v);const cur=p.versions[0];

/* ================= dialogs ================= */
function openDialog(html,cls){document.getElementById('overlays').innerHTML='<div class="scrim show" onclick="if(event.target===this)closeDlg()"><div class="dialog '+(cls||'')+'" role="dialog">'+html+'</div></div>'}

function renameDlg(id){const p=byId(id);openDialog('<h3>Rename prompt</h3><p class="sub">Referenced prompts keep working — references bind by id.</p><div class="field"><input class="inp" id="rn" value="'+esc(p.name)+'"></div><div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="commitRename(\''+id+'\',document.getElementById(\'rn\').value);closeDlg()">Save</button></div>')}
function labelsDlg(id){const p=byId(id);const rerun=()=>labelsDlg(id);window._lbl=rerun;
 openDialog('<h3>Edit labels</h3><p class="sub">Free-form organizing tags — unrelated to environments.</p><div class="addrow" style="flex-wrap:wrap;margin-bottom:12px">'+p.labels.map((l,i)=>'<span class="tagpill">'+esc(l)+' <a style="cursor:pointer;margin-left:4px" onclick="byId(\''+id+'\').labels.splice('+i+',1);window._lbl()">✕</a></span>').join('')+'</div><div class="field"><input class="inp" id="lbl-in" placeholder="team:support, pii, experimental… (Enter to add)" onkeydown="if(event.key===\'Enter\'&&this.value){byId(\''+id+'\').labels.push(this.value.trim());window._lbl()}"></div><div class="dlg-foot"><button class="btn primary" onclick="closeDlg();render();toast(\'Labels saved\',\'tag\')">Done</button></div>')}
function promoteDlg(id,ver){const p=byId(id);const v=ver||p.version;
 openDialog('<h3>Promote v'+v+'</h3><p class="sub">Moves the environment pointer — promotion is explicit and audited.</p><div class="field"><label>Target environment</label><select class="inp" id="pr-env"><option>dev</option><option>staging</option><option selected>production</option></select></div><div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="doPromote(\''+id+'\','+v+')">Confirm promote</button></div>')}
function doPromote(id,v){const p=byId(id);const env=document.getElementById('pr-env').value;p.versions.forEach(x=>{if(x.tag===env)x.tag=null});const tv=p.versions.find(x=>x.v===v);if(tv)tv.tag=env;p.env=highestEnv(p);closeDlg();render();toast('v'+v+' promoted to '+env,'upload')}
function exportDlg(id){const p=byId(id);window._exp=fmt=>{const data={name:p.name,kind:p.kind,version:p.version,labels:p.labels,output:p.output,template:tpl(p)};
 const y='name: '+p.name+'\nkind: '+p.kind+'\nversion: '+p.version+'\nlabels: ['+p.labels.join(', ')+']\noutput: '+p.output+'\ntemplate: |\n  '+tpl(p).split('\n').join('\n  ');
 document.getElementById('exp-pre').textContent=fmt==='json'?JSON.stringify(data,null,2):y;
 document.querySelectorAll('#exp-tgl button').forEach(b=>b.classList.toggle('on',b.dataset.f===fmt))};
 openDialog('<h3>Export '+esc(p.name)+'</h3><div class="tgl" id="exp-tgl" style="width:180px;margin-bottom:10px"><button class="on" data-f="json" onclick="window._exp(\'json\')">JSON</button><button data-f="yaml" onclick="window._exp(\'yaml\')">YAML</button></div><div class="exportpre" id="exp-pre"></div><div class="dlg-foot"><button class="btn outline" onclick="toast(\'Copied\',\'copy\')">'+icon('copy')+'Copy</button><button class="btn primary" onclick="toast(\'Downloaded\',\'download\')">'+icon('download')+'Download</button></div>');window._exp('json')}
function importDlg(){openDialog('<h3>Import prompt</h3><p class="sub">Paste JSON or YAML exported from Keystone.</p><div class="field"><textarea class="inp" style="height:120px;padding:8px" placeholder="paste here…"></textarea></div><div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="closeDlg();toast(\'Imported (mock)\',\'upload\')">Import</button></div>')}
function archiveDlg(id){const p=byId(id);if(p.archived){p.archived=false;render();toast('Restored '+p.name,'archive');return}
 openDialog('<h3>Archive '+esc(p.name)+'?</h3><p class="sub">You can restore it later. Flows that pin it keep working.</p><div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="doArchive(\''+id+'\')">Archive</button></div>')}

 openDialog('<h3 style="color:var(--destructive)">Delete '+esc(p.name)+'</h3><p class="sub">This permanently deletes <b>'+esc(p.name)+'</b> and all its versions. This cannot be undone.</p><div class="field"><label>Type <b class="mono">'+esc(p.name)+'</b> to confirm</label><input class="inp" id="del-in" autocomplete="off" oninput="document.getElementById(\'del-go\').disabled=this.value!==\''+esc(p.name)+'\'"></div><div class="dlg-foot"><button class="btn outline" onclick="closeDlg()">Cancel</button><button class="btn destructive" id="del-go" disabled onclick="doDelete(\''+id+'\')">Delete forever</button></div>')}

/* ================= command palette ================= */
function openCmdk(){S.ksel=0;const r=route();const items=[];
 items.push({g:'Go to',n:'Prompts list',ic:'braces',fn:"go('#/prompts')"});
 PROMPTS.filter(p=>!p.archived).forEach(p=>items.push({g:'Go to',n:p.name,ic:p.kind==='chat'?'msg':'type',cat:'v'+p.version,fn:"openPrompt('"+p.id+"')"}));
 items.push({g:'Create',n:'New chat prompt',ic:'msg',fn:"newPrompt('chat')"});
 items.push({g:'Create',n:'New text prompt',ic:'type',fn:"newPrompt('text')"});
 if(r.scr==='editor'){const id=r.id;
  [['Run','play',"go('#/p/"+id+"/run')"],['Compress','shrink',"go('#/p/"+id+"/edit');S.compress={method:'llmlingua2',target:'rate',rate:60,tok:280,digits:true,done:null};render()"],['Compare','cols',"S.runMode='compare';go('#/p/"+id+"/run')"],['Promote','upload',"promoteDlg('"+id+"')"],['Version history','clock',"go('#/p/"+id+"/manage')"],['Edit labels','tag',"labelsDlg('"+id+"')"],['Export','download',"exportDlg('"+id+"')"],['Duplicate','copy',"dupPrompt('"+id+"')"],['Archive','archive',"archiveDlg('"+id+"')"],['Optimize','sparkles',"toast('Optimize lives in Learn','sparkles')"]].forEach(d=>items.push({g:'Do',n:d[0],ic:d[1],cat:byId(id).name,fn:d[2]}));
  PROMPTS.filter(x=>x.id!==id&&!x.archived).forEach(x=>items.push({g:'Insert reference',n:'Insert reference: '+x.name,ic:'braces',fn:"insRef("+(byId(id).kind==='chat'?0:0)+",'"+x.id+"')"}))}
 S.recent.forEach(id0=>{const p=byId(id0);if(p)items.push({g:'Recent',n:p.name,ic:'clock',cat:'recent',fn:"openPrompt('"+p.id+"')"})});
 window._KITEMS=items;
 document.getElementById('overlays').innerHTML='<div class="scrim show" style="padding-top:12vh" onclick="if(event.target===this)closeDlg()"><div class="cmdk"><div class="cin">'+icon('search')+'<input id="ck-in" placeholder="Search prompts, actions, references…" oninput="drawCmdk(this.value)" autocomplete="off"><kbd>esc</kbd></div><div class="list" id="ck-list"></div><div class="cfoot"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div></div></div>';
 drawCmdk('');document.getElementById('ck-in').focus()}
function kfilter(q){return window._KITEMS.filter(i=>!q||i.n.toLowerCase().includes(q.toLowerCase()))}
function drawCmdk(q){const list=kfilter(q);let g='';S.ksel=Math.min(S.ksel,Math.max(0,list.length-1));
 document.getElementById('ck-list').innerHTML=list.map((i,idx)=>{const gl=i.g!==g?'<div class="glabel">'+i.g+'</div>':'';g=i.g;
 return gl+'<div class="crow'+(idx===S.ksel?' sel':'')+'" onclick="execK('+idx+')">'+icon(i.ic)+esc(i.n)+(i.cat?'<span class="cat">'+esc(i.cat)+'</span>':'')+'</div>'}).join('')||'<div class="glabel">No matches</div>'}
function execK(idx){const q=document.getElementById('ck-in').value;const it=kfilter(q)[idx];if(!it)return;closeDlg();try{eval(it.fn)}catch(e){}}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();return}
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){const r=route();if(r.scr==='editor'&&r.mode==='edit'){if(!S.qr){S.qr=true;render()}runQuick()}return}
 const ck=document.getElementById('ck-in');
 if(ck){const q=ck.value;const n=kfilter(q).length;
  if(e.key==='ArrowDown'){e.preventDefault();S.ksel=Math.min(n-1,S.ksel+1);drawCmdk(q)}
  if(e.key==='ArrowUp'){e.preventDefault();S.ksel=Math.max(0,S.ksel-1);drawCmdk(q)}
  if(e.key==='Enter'){e.preventDefault();execK(S.ksel)}}
 if(e.key==='Escape'){closeDlg();closeMenus();if(S.qr){S.qr=false;render()}}});

/* ================= menus ================= */
function openMenu(e,html){e.stopPropagation();closeMenus();const m=document.createElement('div');m.className='menu';m.innerHTML=html;document.body.appendChild(m);
 const x=Math.min((e.clientX||100),innerWidth-m.offsetWidth-260);const y=Math.min((e.clientY||100),innerHeight-m.offsetHeight-10);
 m.style.left=Math.max(8,x)+'px';m.style.top=Math.max(8,y)+'px';
 requestAnimationFrame(()=>{const r=m.getBoundingClientRect();if(r.right>innerWidth-8)m.style.left=(innerWidth-r.width-8)+'px';if(r.bottom>innerHeight-8)m.style.top=(innerHeight-r.height-8)+'px'})}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove())}
document.addEventListener('click',()=>closeMenus());

/* ================= render root ================= */
function toggleSB(){const s=document.querySelector('.sidebar');if(s)s.classList.toggle('open');const c=document.querySelector('.sb-scrim');if(c)c.classList.toggle('show')}
function render(){const r=route();let hdr,body;
 if(r.scr==='list'){hdr='<div class="crumb">'+icon('braces')+'<span class="cur">Prompts</span><span class="ctxnote" style="margin-left:6px">'+PROMPTS.filter(p=>!p.archived).length+' prompts · acme-support</span></div>'+listHeader();body=listScreen()}
 else{const p=byId(r.id);hdr=editorHeader(p,r.mode);body=r.mode==='edit'?editScreen(p):r.mode==='run'?runScreen(p):manageScreen(p)}
 document.getElementById('app').innerHTML=sidebar(r)+'<div class="sb-scrim" onclick="toggleSB()"></div><div class="main"><header class="header"><button class="hamburger" onclick="toggleSB()" aria-label="Menu">'+icon('menu')+'</button>'+hdr+'</header><div class="content">'+body+'</div></div>';animateCounts()}
render();
